<?xml version="1.0" encoding="UTF-8"?>
<!-- Étiquette prix Galzin — Lot de 2 pains spéciaux — 100 x 70 mm
     Polices : Impact (Windows) + Eroika Slab (Adobe Fonts) -->
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="70mm" viewBox="0 0 1000 700">
  <g id="Fond">
    <rect x="0" y="0" width="1000" height="700" rx="30" fill="#2a1d12"/>
    <rect x="16" y="16" width="968" height="668" rx="20" fill="#ffcc4d"/>
    <rect x="30" y="30" width="940" height="640" rx="12" fill="none" stroke="#2a1d12" stroke-width="3"/>
  </g>
  <g id="Bandeau_offre">
    <rect x="30" y="30" width="940" height="120" fill="#2a1d12"/>
    <text x="500" y="122" text-anchor="middle" font-family="Impact" font-size="92" letter-spacing="6" fill="#ffcc4d">OFFRE SPÉCIALE</text>
    <path d="M150 90 l9 18 20 3 -14 14 3 20 -18 -9 -18 9 3 -20 -14 -14 20 -3 z" transform="translate(-40 -28)" fill="#ffcc4d"/>
    <path d="M850 90 l9 18 20 3 -14 14 3 20 -18 -9 -18 9 3 -20 -14 -14 20 -3 z" transform="translate(20 -28)" fill="#ffcc4d"/>
  </g>
  <g id="Titre">
    <text x="500" y="228" text-anchor="middle" font-family="Eroika Slab" font-weight="700" font-size="62" fill="#5a2e14">le lot de</text>
    <text x="500" y="338" text-anchor="middle" font-family="Impact" font-size="112" fill="#2a1d12">2 PAINS SPÉCIAUX</text>
  </g>
  <g id="Prix">
    <text x="318" y="645" text-anchor="end" font-family="Impact" font-size="280" fill="#2a1d12">4</text>
    <text x="325" y="530" font-family="Impact" font-size="122" fill="#b3261e">€</text>
    <text x="400" y="645" font-family="Impact" font-size="280" fill="#2a1d12">50</text>
  </g>
  <g id="Pastille_prix_unitaire" transform="rotate(-12 845 520)">
    <circle cx="845" cy="520" r="105" fill="#b3261e"/>
    <circle cx="845" cy="520" r="93" fill="none" stroke="#ffcc4d" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
    <text x="845" y="482" text-anchor="middle" font-family="Eroika Slab" font-weight="700" font-size="34" fill="#fdf0e3">soit</text>
    <text x="845" y="552" text-anchor="middle" font-family="Impact" font-size="70" fill="#ffcc4d">2,25€</text>
    <text x="845" y="592" text-anchor="middle" font-family="Eroika Slab" font-weight="700" font-size="32" fill="#fdf0e3">la pièce</text>
  </g>
</svg>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Dancing Script";
        src: url("assets/fonts/dancing-script-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      /* THEME — Galzin house look (chocolate, cream, gold) ; the Minions only show up as the yellow stamp */
      :root {
        --bg-center: #5a3822;
        --bg-edge: #1d1109;
        --cream: #fdf1dc;
        --yellow: #ffcc4d;
        --ink: #3a2414;
        --gold-a: #f3e2bd;
        --gold-b: #b48a52;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-edge);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--cream);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 55%, var(--bg-center) 0%, var(--bg-edge) 80%);
      }
      #dots {
        position: absolute;
        inset: 0;
      }
      .dot {
        position: absolute;
        border-radius: 50%;
        border: 3px solid var(--yellow);
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        opacity: 0.55;
      }
      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
      }
      #logo-halo {
        position: absolute;
        inset: -70px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 204, 77, 0.35) 0%, rgba(255, 204, 77, 0) 65%);
      }

      /* Title */
      #title {
        position: absolute;
        left: 300px;
        right: 300px;
        top: 40px;
        text-align: center;
      }
      #script {
        display: inline-block;
        font-family: "Dancing Script", cursive;
        font-weight: 700;
        font-size: 150px;
        line-height: 1.15;
        color: var(--cream);
      }
      #sub {
        margin-top: -18px;
        font-size: 62px;
        letter-spacing: 6px;
        color: var(--yellow);
      }

      /* Photo slots (empty until the real photos arrive) */
      .ph {
        position: absolute;
        border: 3px dashed rgba(243, 226, 189, 0.5);
        background: radial-gradient(ellipse, rgba(255, 204, 77, 0.1) 0%, rgba(255, 204, 77, 0) 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        color: var(--gold-a);
        opacity: 0.85;
      }
      .shot {
        position: absolute;
        object-fit: contain;
        filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.5));
      }

      /* Fèves */
      .fv {
        position: absolute;
        top: 330px;
        width: 300px;
        height: 480px;
        margin-left: -150px;
      }
      .fv .glow {
        position: absolute;
        left: -40px;
        top: 40px;
        width: 380px;
        height: 340px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 204, 77, 0.32) 0%, rgba(255, 204, 77, 0) 65%);
      }
      .fv .ph {
        left: 35px;
        top: 85px;
        width: 230px;
        height: 290px;
        border-radius: 50%;
        font-size: 30px;
        line-height: 1.05;
      }
      .fv .shot {
        left: 15px;
        top: 80px;
        width: 270px;
        height: 300px;
      }
      .num {
        position: absolute;
        left: 115px;
        top: 0;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: var(--cream);
        color: var(--ink);
        font-size: 58px;
        line-height: 78px;
        text-align: center;
      }
      .fv-name {
        position: absolute;
        left: 0;
        top: 400px;
        width: 300px;
        text-align: center;
        font-size: 58px;
        line-height: 1;
        letter-spacing: 2px;
        color: var(--cream);
      }

      /* Galette */
      #galette {
        position: absolute;
        left: 660px;
        top: 560px;
        width: 600px;
        height: 400px;
      }
      #gal-glow {
        position: absolute;
        inset: -60px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 204, 77, 0.35) 0%, rgba(255, 204, 77, 0) 65%);
      }
      #galette .ph {
        inset: 0;
        border-radius: 50%;
        font-size: 44px;
      }
      #galette .shot {
        inset: 0;
        width: 600px;
        height: 400px;
      }

      #q {
        position: absolute;
        left: 0;
        right: 0;
        top: 230px;
        text-align: center;
      }
      #q-1 {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 56px;
        line-height: 1.1;
        color: var(--yellow);
      }
      #q-2 {
        font-size: 130px;
        line-height: 1;
        letter-spacing: 4px;
        color: var(--cream);
      }

      /* Prices */
      .medal {
        position: absolute;
        top: 420px;
        width: 260px;
        height: 260px;
        margin-left: -130px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--gold-a) 0%, var(--gold-b) 100%);
        box-shadow: 0 24px 46px rgba(0, 0, 0, 0.5);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .price {
        display: flex;
        align-items: flex-start;
        line-height: 0.82;
      }
      .price .big {
        font-size: 128px;
      }
      .price .sm {
        font-size: 68px;
        margin-top: 10px;
      }
      .parts {
        margin-top: 2px;
        font-size: 40px;
        line-height: 1;
        letter-spacing: 2px;
      }
      #date {
        position: absolute;
        left: 0;
        right: 0;
        top: 800px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 58px;
        color: var(--yellow);
      }
      #legal {
        position: absolute;
        right: 70px;
        bottom: 46px;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 28px;
        color: var(--cream);
      }
      #veil {
        position: absolute;
        inset: 0;
        background: var(--bg-edge);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="dots"></div>

      <div id="title"><div id="script">Galette des Rois</div><div id="sub">ÉDITION LES MINIONS</div></div>

      <div id="feves"></div>

      <div id="galette">
        <div id="gal-glow"></div>
        <div id="gal-art"></div>
      </div>

      <div id="q">
        <div id="q-1">Une fève Les Minions dans chaque galette</div>
        <div id="q-2">LAQUELLE TROUVEREZ-VOUS ?</div>
      </div>

      <div id="prices"></div>
      <div id="date">Dès le 2 janvier dans vos boutiques Galzin</div>

      <div id="logo">
        <div id="logo-halo"></div>
        <img src="assets/img/galzin-logo.png" alt="Galzin" />
      </div>
      <div id="frame"></div>
      <div id="legal">Photos non contractuelles</div>
      <div id="veil"></div>
    </div>

    <script>
      // ── CONTENT — edit here. Drop the real photos in assets/img/ (PNG without background) and set `img`.
      const FEVES = [
        { name: "FÈVE 1", img: "" },
        { name: "FÈVE 2", img: "" },
        { name: "FÈVE 3", img: "" },
        { name: "FÈVE 4", img: "" },
        { name: "FÈVE 5", img: "" },
      ];
      const GALETTE_IMG = ""; // e.g. "galette.png"
      const PRICES = [
        { parts: "4 PARTS", big: "12", sm: "€90" },
        { parts: "6 PARTS", big: "17", sm: "€90" },
        { parts: "8 PARTS", big: "22", sm: "€90" },
      ];

      const fevesEl = document.getElementById("feves");
      const FX = (i) => 960 + (i - 2) * 330;
      FEVES.forEach((f, i) => {
        const art = f.img ? '<img class="shot" src="assets/img/' + f.img + '" alt="" />' : '<div class="ph">photo<br />fève ' + (i + 1) + "</div>";
        fevesEl.insertAdjacentHTML(
          "beforeend",
          '<div class="fv" id="fv' + i + '" style="left:' + FX(i) + 'px"><div class="glow"></div><div class="art" id="fa' + i + '">' + art + "</div>" +
            '<div class="num" id="fn' + i + '">' + (i + 1) + '</div><div class="fv-name" id="fl' + i + '">' + f.name + "</div></div>"
        );
      });
      document.getElementById("gal-art").innerHTML = GALETTE_IMG ? '<img class="shot" src="assets/img/' + GALETTE_IMG + '" alt="" />' : '<div class="ph">photo galette</div>';

      document.getElementById("prices").innerHTML = PRICES.map(
        (p, i) =>
          '<div class="medal" id="md' + i + '" style="left:' + (1110 + i * 290) + 'px"><div class="price"><span class="big">' + p.big + '</span><span class="sm">' + p.sm + '</span></div><div class="parts">' + p.parts + "</div></div>"
      ).join("");

      let seed = 61;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const dotsEl = document.getElementById("dots");
      const dots = [];
      for (let i = 0; i < 14; i++) {
        const d = document.createElement("div");
        d.className = "dot";
        const size = Math.round(26 + rand() * 40);
        d.style.width = d.style.height = size + "px";
        d.style.left = Math.round(60 + rand() * 1780) + "px";
        d.style.top = Math.round(60 + rand() * 940) + "px";
        dotsEl.appendChild(d);
        dots.push({ el: d, op: 0.08 + rand() * 0.12, dx: -30 + rand() * 60, dy: -40 - rand() * 50 });
      }

      gsap.set(["#title", ".fv", "#galette", "#q", ".medal", "#date", "#legal", "#veil"], { autoAlpha: 0 });

      const tl = gsap.timeline({ paused: true });
      dots.forEach((d) => {
        tl.fromTo(d.el, { autoAlpha: 0, x: 0, y: 0 }, { autoAlpha: d.op, x: d.dx, y: d.dy, duration: 15, ease: "none" }, 0);
      });
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.8 }, 0.2);

      // ── Logo intro → top-right corner
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#logo-halo", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.4);
      tl.to("#logo", { x: 790, y: -340, scale: 170 / 360, duration: 0.7, ease: "power3.inOut" }, 1.4);
      tl.to("#logo-halo", { autoAlpha: 0, duration: 0.4 }, 1.4);

      // ── Title + Minions stamp
      tl.fromTo("#title", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.6);
      tl.fromTo("#sub", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.95);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 0.75, duration: 0.5 }, 2.0);

      // ── The five fèves, one by one (2.6 → 6.4)
      FEVES.forEach((f, i) => {
        const t = 2.6 + i * 0.6;
        tl.fromTo("#fv" + i, { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        tl.fromTo("#fn" + i, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, t + 0.15);
      });

      // ── Galette arrives, the fèves slip inside one after the other (6.6 → 9.2)
      tl.to(".fv-name", { autoAlpha: 0, duration: 0.3 }, 6.5);
      tl.to(".num", { autoAlpha: 0, duration: 0.3 }, 6.5);
      tl.fromTo("#galette", { autoAlpha: 0, y: 120 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out" }, 6.6);
      FEVES.forEach((f, i) => {
        const t = 7.3 + i * 0.32;
        tl.to("#fv" + i, { x: 960 - FX(i), y: 300, scale: 0.35, autoAlpha: 0, duration: 0.6, ease: "power2.in" }, t);
      });
      tl.fromTo("#gal-glow", { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 8.9);

      // ── The question (9.4 → 11.4)
      tl.to("#title", { autoAlpha: 0, duration: 0.3 }, 9.3);
      tl.to("#galette", { y: 40, duration: 0.6, ease: "power2.inOut" }, 9.3);
      tl.fromTo("#q", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.3);

      // ── Prices per size + date (11.5 → 14.4)
      tl.to("#q", { autoAlpha: 0, duration: 0.3 }, 11.7);
      tl.fromTo("#title", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, immediateRender: false }, 11.9);
      tl.to("#galette", { x: -420, y: -110, duration: 0.7, ease: "power3.inOut" }, 11.8);
      PRICES.forEach((p, i) => {
        tl.fromTo("#md" + i, { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 12.1 + i * 0.15);
      });
      tl.fromTo("#date", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 12.6);

      // ── Clean exit for the loop
      tl.to("#veil", { autoAlpha: 1, duration: 0.55, ease: "power1.inOut" }, 14.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      /* THEME — the Happy Hour poster: orange/cream sunburst, chocolate type, cream card */
      :root {
        --orange: #e08a24;
        --orange-2: #f0a646;
        --cream: #fdefe0;
        --brown: #5a2e14;
        --brown-2: #3c2416;
        --bronze-a: #e3a35a;
        --bronze-b: #a8662d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--brown);
      }
      #sun {
        position: absolute;
        left: -540px;
        top: -1000px;
        width: 3000px;
        height: 3000px;
        border-radius: 50%;
        background: repeating-conic-gradient(var(--orange) 0deg 9deg, var(--cream) 9deg 18deg);
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 3px solid var(--brown);
        border-radius: 18px;
        opacity: 0.35;
      }
      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
        filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.35));
      }

      /* Cream card */
      #card {
        position: absolute;
        left: 140px;
        top: 200px;
        width: 1640px;
        height: 700px;
        border-radius: 70px;
        background: var(--cream);
        border: 12px solid var(--brown);
        box-shadow: 0 30px 60px rgba(60, 36, 22, 0.35);
      }

      /* Happy Hour sticker */
      #hh {
        position: absolute;
        left: 70px;
        top: 70px;
        width: 860px;
        height: 520px;
      }
      .hw {
        position: absolute;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        line-height: 1;
        color: var(--brown);
        paint-order: stroke fill;
        -webkit-text-stroke: 34px var(--cream);
        text-shadow: 0 16px 24px rgba(60, 36, 22, 0.35);
        white-space: nowrap;
      }
      #hw1 {
        left: 30px;
        top: 0;
        font-size: 290px;
        transform: rotate(-5deg);
      }
      #hw2 {
        left: 130px;
        top: 250px;
        font-size: 290px;
        transform: rotate(-5deg);
      }

      /* -50% */
      #pct {
        position: absolute;
        left: 960px;
        top: 220px;
        font-size: 470px;
        line-height: 0.82;
        letter-spacing: -6px;
        color: var(--brown);
        white-space: nowrap;
      }
      #pct sup {
        font-size: 90px;
        vertical-align: top;
      }

      /* Clock + condition */
      #cond {
        position: absolute;
        left: 940px;
        top: 650px;
        width: 820px;
        display: flex;
        align-items: center;
        gap: 30px;
      }
      #clock {
        width: 190px;
        height: 190px;
        flex: none;
      }
      #cond-t {
        font-size: 84px;
        line-height: 0.95;
        color: var(--brown);
      }
      #cond-t b {
        font-weight: 400;
        color: #b5560f;
      }

      /* Selection */
      #sel {
        position: absolute;
        left: 210px;
        top: 640px;
        width: 700px;
      }
      #sel-pill {
        display: inline-block;
        padding: 6px 30px 10px;
        border-radius: 40px;
        background: #b5560f;
        color: var(--cream);
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 46px;
        line-height: 1;
      }
      #prod-name {
        position: relative;
        margin-top: 10px;
        height: 70px;
      }
      .pn {
        position: absolute;
        left: 0;
        top: 0;
        font-size: 74px;
        line-height: 1;
        color: var(--brown);
        white-space: nowrap;
      }
      #all {
        position: absolute;
        left: 210px;
        top: 712px;
        width: 700px;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 35px;
        line-height: 1.15;
        color: var(--brown);
      }
      #non {
        position: absolute;
        left: 210px;
        top: 852px;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 30px;
        color: var(--brown);
      }

      /* Product carousel (sits above the card, top-left corner area) */
      .pr {
        position: absolute;
        object-fit: contain;
        filter: drop-shadow(0 20px 18px rgba(60, 36, 22, 0.45));
      }

      /* Fidelity pill */
      #fid {
        position: absolute;
        left: 560px;
        top: 900px;
        width: 800px;
        height: 150px;
        border-radius: 80px;
        background: var(--brown-2);
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 40px;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
      }
      #fid-p {
        font-size: 130px;
        line-height: 1;
        padding-top: 12px;
        color: var(--cream);
      }
      #fid-t {
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 38px;
        line-height: 1.02;
        color: var(--cream);
      }
      #fid-t b {
        display: inline-block;
        margin-top: 6px;
        padding: 4px 18px 0;
        border-radius: 12px;
        background: linear-gradient(100deg, var(--bronze-b) 0%, var(--bronze-a) 100%);
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        font-size: 50px;
        letter-spacing: 2px;
        color: var(--brown-2);
      }
      #veil {
        position: absolute;
        inset: 0;
        background: var(--cream);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="sun"></div>
      <div id="card"></div>

      <div id="pct">-50%<sup>*</sup></div>

      <div id="cond">
        <svg id="clock" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="90" fill="#fdefe0" stroke="#5a2e14" stroke-width="12" />
          <path id="wedge" fill="#e08a24" d="" />
          <g stroke="#5a2e14" stroke-width="6" stroke-linecap="round">
            <line x1="100" y1="22" x2="100" y2="36" /><line x1="178" y1="100" x2="164" y2="100" />
            <line x1="100" y1="178" x2="100" y2="164" /><line x1="22" y1="100" x2="36" y2="100" />
          </g>
          <line id="hand-h" x1="100" y1="100" x2="100" y2="58" stroke="#5a2e14" stroke-width="10" stroke-linecap="round" />
          <line id="hand-m" x1="100" y1="100" x2="100" y2="34" stroke="#5a2e14" stroke-width="7" stroke-linecap="round" />
          <circle cx="100" cy="100" r="9" fill="#5a2e14" />
        </svg>
        <div id="cond-t"><b>30 MIN</b> AVANT LA FERMETURE DU MAGASIN</div>
      </div>

      <div id="sel">
        <div id="sel-pill">sur une sélection de produits :</div>
        <div id="prod-name"></div>
      </div>
      <div id="all">Pains de campagne, viennoiseries, petites pâtisseries, traiteur salé (hors pizzeria), sandwichs.</div>
      <div id="non">*Non cumulable avec les autres offres</div>

      <div id="prods"></div>

      <div id="hh">
        <div class="hw" id="hw1" data-layout-allow-overlap="true">Happy</div>
        <div class="hw" id="hw2" data-layout-allow-overlap="true">Hour</div>
      </div>

      <div id="fid">
        <div id="fid-p">5%</div>
        <div id="fid-t">toujours crédités en plus<br />sur votre <b>CARTE DE FIDÉLITÉ</b></div>
      </div>

      <div id="logo"><img src="assets/img/galzin-logo.png" alt="Galzin" /></div>
      <div id="frame"></div>
      <div id="veil"></div>
    </div>

    <script>
      // ── Products on promotion: one category name per group of photos
      const CATS = [
        ["PAINS DE CAMPAGNE", ["pain.png"]],
        ["VIENNOISERIES", ["croissant.png", "chocolatine.png"]],
        ["PETITES PÂTISSERIES", ["tarte-fraises.png", "flan.png"]],
        ["TRAITEUR SALÉ", ["tielle.png"]],
        ["SANDWICHS", ["mixte.png", "chevre-noix.png"]],
      ];
      // product stage: bottom-right of the screen, below the -50%
      const SLOTS = [
        { left: 960, top: 600, w: 400, h: 280 },
        { left: 1360, top: 600, w: 400, h: 280 },
      ];
      const prodsEl = document.getElementById("prods");
      const nameEl = document.getElementById("prod-name");
      const groups = [];
      CATS.forEach((c, gi) => {
        nameEl.insertAdjacentHTML("beforeend", '<div class="pn" id="pn' + gi + '">' + c[0] + "</div>");
        const imgs = c[1].map((src, k) => {
          const s = SLOTS[c[1].length === 1 ? 0 : k];
          const id = "pr" + gi + "_" + k;
          const w = c[1].length === 1 ? 780 : s.w;
          const left = c[1].length === 1 ? 970 : s.left;
          prodsEl.insertAdjacentHTML(
            "beforeend",
            '<img class="pr" id="' + id + '" src="assets/img/' + src + '" style="left:' + left + "px;top:" + s.top + "px;width:" + w + "px;height:" + s.h + 'px" alt="" />'
          );
          return "#" + id;
        });
        groups.push({ name: "#pn" + gi, imgs });
      });

      // clock wedge (the last 30 minutes = half the dial)
      const wedge = document.getElementById("wedge");
      const setWedge = (deg) => {
        const a = ((deg - 90) * Math.PI) / 180;
        const x = 100 + 78 * Math.cos(a), y = 100 + 78 * Math.sin(a);
        wedge.setAttribute("d", deg <= 0 ? "" : "M100 100 L100 22 A78 78 0 " + (deg > 180 ? 1 : 0) + " 1 " + x.toFixed(1) + " " + y.toFixed(1) + " Z");
      };
      const clk = { d: 0 };
      setWedge(0);

      gsap.set(["#veil", "#fid", ".pn", ".pr", "#all"], { autoAlpha: 0 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.35, duration: 0.8 }, 0.2);
      tl.fromTo("#sun", { rotation: 0, scale: 0.6 }, { rotation: 60, scale: 1, duration: 15, ease: "power1.out" }, 0);

      // ── Logo → corner
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.6)" }, 0.1);
      tl.to("#logo", { x: 790, y: -340, scale: 150 / 360, duration: 0.6, ease: "power3.inOut" }, 1.0);

      // ── Card + Happy Hour sticker (1.2 → 3)
      tl.fromTo("#card", { autoAlpha: 0, scale: 0.8, y: 60 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.4)" }, 1.2);
      tl.fromTo("#hw1", { autoAlpha: 0, scale: 0.2, rotation: -40 }, { autoAlpha: 1, scale: 1, rotation: -5, duration: 0.5, ease: "back.out(2)" }, 1.6);
      tl.fromTo("#hw2", { autoAlpha: 0, scale: 0.2, rotation: 30 }, { autoAlpha: 1, scale: 1, rotation: -5, duration: 0.5, ease: "back.out(2)" }, 1.85);
      tl.to("#hh", { keyframes: [{ rotation: 3, duration: 0.12 }, { rotation: -2, duration: 0.12 }, { rotation: 0, duration: 0.12 }] }, 2.35);

      // ── -50% slams in (2.7)
      tl.fromTo("#pct", { autoAlpha: 0, scale: 3.2, rotation: 10 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.35, ease: "power4.in" }, 2.7);
      tl.to("#card", { keyframes: [{ y: 14, duration: 0.05 }, { y: -8, duration: 0.06 }, { y: 0, duration: 0.08 }] }, 3.05);
      tl.to("#pct", { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 3.5);

      // ── 30 min before closing: the clock fills half the dial (3.9 → 6.2)
      tl.fromTo("#cond", { autoAlpha: 0, x: 80 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.9);
      tl.fromTo("#hand-m", { rotation: 0, svgOrigin: "100 100" }, { rotation: 180, svgOrigin: "100 100", duration: 1.8, ease: "power1.inOut" }, 4.3);
      tl.fromTo(clk, { d: 0 }, { d: 180, duration: 1.8, ease: "power1.inOut", onUpdate: () => setWedge(clk.d) }, 4.3);
      tl.to("#clock", { keyframes: [{ rotation: -8, duration: 0.07 }, { rotation: 8, duration: 0.07 }, { rotation: -5, duration: 0.07 }, { rotation: 0, duration: 0.07 }] }, 6.1);

      // ── Selection: category names + photos rotate (6.4 → 12.4)
      tl.fromTo("#sel", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 6.3);
      tl.fromTo("#non", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 6.5);
      // move the condition up a little to leave room for the products under -50%
      tl.to("#cond", { y: -40, scale: 0.9, transformOrigin: "0% 50%", duration: 0.5, ease: "power3.inOut" }, 6.3);
      tl.to("#cond", { autoAlpha: 0, duration: 0.3 }, 6.5);
      const GS = 1.2;
      groups.forEach((g, i) => {
        const t = 6.6 + i * GS;
        tl.fromTo(g.name, { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        g.imgs.forEach((im, k) => {
          tl.fromTo(im, { autoAlpha: 0, y: 260, rotation: k ? 10 : -10 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, t + k * 0.1);
        });
        if (i < groups.length - 1) {
          tl.to(g.name, { autoAlpha: 0, y: -24, duration: 0.2 }, t + GS - 0.2);
          tl.to(g.imgs, { autoAlpha: 0, y: 200, duration: 0.25, ease: "power2.in" }, t + GS - 0.25);
        }
      });

      // ── Bring the condition back + fidelity pill (12.6 → 14.4)
      const last = groups[groups.length - 1];
      tl.to([last.name, ...last.imgs], { autoAlpha: 0, duration: 0.25 }, 12.6);
      tl.to("#cond", { autoAlpha: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 12.65);
      tl.fromTo("#all", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 12.75);
      tl.fromTo("#fid", { autoAlpha: 0, y: 140 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" }, 12.8);
      tl.to("#pct", { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1 }, 13.5);
      tl.to("#logo", { scale: 190 / 360, x: 770, y: -320, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 1 }, 13.6);

      // ── Clean exit for the loop
      tl.to("#veil", { autoAlpha: 1, duration: 0.55, ease: "power1.inOut" }, 14.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

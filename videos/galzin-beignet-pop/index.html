<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Transparent overlay: the donut pops out of the hand, floats, then goes back. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #donut { position: absolute; left: 90px; top: 660px; width: 900px; transform-origin: 50% 80%; }
      #donut img { display: block; width: 900px; }
      #ring { position: absolute; left: 540px; top: 980px; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%;
              border: 14px solid #ff8a1c; }
      #ring2 { position: absolute; left: 540px; top: 980px; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%;
               border: 8px solid #fff4dc; }
      .sp { position: absolute; left: 540px; top: 980px; width: 46px; height: 46px; margin: -23px 0 0 -23px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="ring"></div>
      <div id="ring2"></div>
      <div id="donut"><img src="assets/img/beignet.png" alt="Beignet chocolat Halloween" /></div>
    </div>
    <script>
      const root = document.getElementById("root");
      const colors = ["#ff8a1c", "#fff4dc", "#9b5de5", "#ff8a1c", "#ffd36b", "#fff4dc"];
      const sparks = [];
      for (let i = 0; i < 16; i++) {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("viewBox", "0 0 34 34");
        s.setAttribute("class", "sp");
        s.innerHTML = '<path d="M17 0 L21 13 L34 17 L21 21 L17 34 L13 21 L0 17 L13 13 Z" fill="' + colors[i % colors.length] + '"/>';
        root.appendChild(s);
        sparks.push(s);
      }
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#ring", "#ring2", ".sp"], { autoAlpha: 0 });
      gsap.set("#donut", { autoAlpha: 0, scale: 0, y: 380, rotation: -25 });

      // POP (0 → 0.55)
      tl.to("#donut", { autoAlpha: 1, duration: 0.05 }, 0.05);
      tl.to("#donut", { scale: 1.12, y: -20, rotation: 6, duration: 0.38, ease: "back.out(2.2)" }, 0.05);
      tl.to("#donut", { scale: 1, y: 0, rotation: 0, duration: 0.25, ease: "power2.out" }, 0.43);
      tl.fromTo("#ring", { autoAlpha: 1, scale: 0.2 }, { autoAlpha: 0, scale: 5.5, duration: 0.55, ease: "power2.out", immediateRender: false }, 0.1);
      tl.fromTo("#ring2", { autoAlpha: 1, scale: 0.2 }, { autoAlpha: 0, scale: 4.2, duration: 0.5, ease: "power2.out", immediateRender: false }, 0.18);
      sparks.forEach((s, i) => {
        const a = (i / sparks.length) * Math.PI * 2 + 0.2;
        const r = 430 + (i % 3) * 90;
        tl.fromTo(s, { autoAlpha: 1, x: 0, y: 0, scale: 0.4, rotation: 0 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.9, scale: 1.3 - (i % 3) * 0.25, rotation: 200, duration: 0.7, ease: "power3.out", immediateRender: false }, 0.12);
        tl.to(s, { autoAlpha: 0, scale: 0.2, duration: 0.3 }, 0.6 + (i % 4) * 0.06);
      });

      // FLOAT (0.7 → 3.4)
      tl.to("#donut", { y: -22, rotation: 2, duration: 0.68, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.7);

      // EXIT (3.45 → 4.1): little anticipation, then spins back into the hand
      tl.to("#donut", { scale: 1.08, y: -40, duration: 0.15, ease: "power2.out" }, 3.45);
      tl.to("#donut", { scale: 0, y: 380, rotation: 260, duration: 0.45, ease: "back.in(1.6)" }, 3.6);
      tl.to("#donut", { autoAlpha: 0, duration: 0.05 }, 4.03);
      tl.fromTo("#ring2", { autoAlpha: 1, scale: 0.2 }, { autoAlpha: 0, scale: 2.4, duration: 0.35, ease: "power2.out", immediateRender: false }, 4.02);
      sparks.forEach((s, i) => {
        if (i % 2) return;
        const a = (i / sparks.length) * Math.PI * 2;
        tl.fromTo(s, { autoAlpha: 1, x: 0, y: 0, scale: 0.3 }, { x: Math.cos(a) * 200, y: Math.sin(a) * 200, scale: 0.8, duration: 0.35, ease: "power2.out", immediateRender: false }, 4.02);
        tl.to(s, { autoAlpha: 0, duration: 0.15 }, 4.3);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

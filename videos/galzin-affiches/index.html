<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #3e2618;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
      }

      /* One poster = one full-screen layer */
      .poster {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .poster .bg {
        position: absolute;
        inset: 0;
      }
      .poster .halo {
        position: absolute;
        width: 980px;
        height: 980px;
        border-radius: 50%;
        top: 50px;
      }
      .poster .ring {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        top: 90px;
        border: 3px dashed;
        opacity: 0.35;
      }
      .poster .stage {
        position: absolute;
        top: 120px;
        width: 1000px;
        height: 840px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .poster .stage img {
        max-width: 1000px;
        max-height: 700px;
        object-fit: contain;
        filter: drop-shadow(0 36px 30px rgba(0, 0, 0, 0.45));
      }
      .poster .txt {
        position: absolute;
        top: 0;
        width: 780px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 20px;
      }
      .poster .cat {
        align-self: flex-start;
        padding: 6px 24px 2px;
        border-radius: 30px;
        font-size: 44px;
        letter-spacing: 5px;
        line-height: 1;
      }
      .poster .name {
        margin-top: 22px;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 128px;
        line-height: 0.98;
      }
      .poster .bar {
        width: 200px;
        height: 8px;
        border-radius: 4px;
        margin: 28px 0 24px;
      }
      .poster .tag {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 54px;
        line-height: 1.1;
      }
      .poster .price {
        align-self: flex-start;
        margin-top: 40px;
        padding: 8px 40px 4px;
        border-radius: 60px;
        background: linear-gradient(100deg, #b0743d 0%, #f2c890 50%, #b0743d 100%);
        color: #3e2618;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 84px;
        line-height: 1.1;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
      }
      .poster .price small {
        font-size: 46px;
      }

      /* Persistent brand layer */
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid #ffcc4d;
        border-radius: 18px;
        opacity: 0.5;
        z-index: 100;
      }
      #logo {
        position: absolute;
        right: 60px;
        top: 50px;
        width: 170px;
        height: 170px;
        z-index: 101;
      }
      #logo img {
        width: 170px;
        height: 170px;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35));
      }
      #sig {
        position: absolute;
        right: 70px;
        bottom: 50px;
        z-index: 101;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 30px;
        padding: 4px 18px;
        border-radius: 14px;
        background: rgba(62, 38, 24, 0.75);
        color: #fdf0e3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="147"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="posters"></div>
      <div id="frame"></div>
      <div id="logo"><img src="assets/img/galzin-logo.png" alt="Galzin" /></div>
      <div id="sig">Maison Galzin · depuis 1938</div>
    </div>

    <script>
      // ── Colour worlds (all from the Galzin poster family)
      const THEMES = {
        brown:  { bg: "radial-gradient(ellipse at 70% 50%, #5c3520 0%, #2a170d 85%)", fg: "#fdf0e3", acc: "#ffcc4d", catBg: "#ffcc4d", catFg: "#3e2618", halo: "rgba(255,204,77,0.22)" },
        cream:  { bg: "radial-gradient(ellipse at 70% 50%, #fffaf2 0%, #f1dfc6 90%)", fg: "#3e2618", acc: "#b5560f", catBg: "#3e2618", catFg: "#fdf0e3", halo: "rgba(181,86,15,0.14)" },
        caramel:{ bg: "radial-gradient(ellipse at 70% 50%, #c89064 0%, #8f573a 90%)", fg: "#fdf0e3", acc: "#3e2618", catBg: "#3e2618", catFg: "#fdf0e3", halo: "rgba(253,240,227,0.22)" },
        brique: { bg: "radial-gradient(ellipse at 70% 50%, #8e3322 0%, #3d120b 90%)", fg: "#fdf0e3", acc: "#f2a531", catBg: "#f2a531", catFg: "#3e2618", halo: "rgba(242,165,49,0.2)" },
        beige:  { bg: "radial-gradient(ellipse at 70% 50%, #f6ead8 0%, #dcc3a0 90%)", fg: "#3e2618", acc: "#2c6b69", catBg: "#2c6b69", catFg: "#fdf0e3", halo: "rgba(44,107,105,0.14)" },
      };

      // ── The posters (edit / add / remove products here). No pizza on this screen.
      // [category, name, tagline, price-or-"", image, theme]
      const POSTERS = [
        ["VIENNOISERIE", "Croissant pur beurre", "Feuilleté, doré, croustillant", "1,20€", "croissant", "brown"],
        ["PÂTISSERIE", "Tropézienne individuelle", "Brioche moelleuse et crème légère", "", "tropezienne", "cream"],
        ["SNACKING", "Le Parisien", "Jambon blanc, cornichons", "", "parisien", "caramel"],
        ["PÂTISSERIE", "Baba au rhum", "Bien imbibé, chantilly généreuse", "", "baba", "brique"],
        ["VIENNOISERIE", "Chocolatine pur beurre", "Le classique du matin", "1,40€", "chocolatine", "beige"],
        ["PÂTISSERIE", "Tartelette pomme", "Pommes fondantes, pâte feuilletée", "", "feuillete-pomme", "brown"],
        ["SNACKING", "L'Italien", "Pain aux graines, viande séchée, poivrons", "", "italien", "cream"],
        ["PÂTISSERIE", "Donut", "Moelleux et sucré", "", "donut", "brique"],
        ["BOULANGERIE", "Baguette Galzin", "Cuite chaque jour", "1,00€", "baguette", "beige"],
        ["PÂTISSERIE", "Tartelette aux fraises", "Généreuse en fraises", "", "tarte-fraises", "caramel"],
        ["SNACKING", "Reblochon", "Pain aux graines, jambon cru, reblochon", "", "reblochon", "cream"],
        ["VIENNOISERIE", "Brioche feuilletée", "Caramélisée au sucre", "", "brioche", "brown"],
        ["TRAITEUR", "Tielles individuelles", "Faites maison", "<small>Lot 3+1</small> 11,90€", "tielle", "beige"],
        ["SNACKING", "Wrap", "Frais et gourmand", "", "wrap", "brique"],
        ["VIENNOISERIE", "Briochette feuilletée", "Sucrée et fondante", "", "roule", "caramel"],
        ["SNACKING", "Sandwich Américain", "Frites, steak haché, sauces", "8,90€", "americain", "brown"],
        ["PÂTISSERIE", "Flan pâtissier", "Onctueux et gourmand", "", "flan", "cream"],
        ["SNACKING", "Poulet Kebab", "Poulet, concombre, salade", "", "poulet-kebab", "brique"],
        ["SNACKING", "Salade fraîcheur", "Composée chaque jour", "", "salade", "beige"],
        ["SNACKING", "Le Mixte", "Jambon blanc, emmental", "", "mixte", "caramel"],
        ["SNACKING", "Chèvre Noix", "Jambon cru, chèvre, noix, salade", "", "chevre-noix", "cream"],
      ];
      const HOLD = 7; // seconds per poster
      const TR = 0.8; // transition length
      const KINDS = ["wipe", "circle", "slide", "diag"];

      const host = document.getElementById("posters");
      // build N posters + a copy of the first one at the end for a seamless loop
      const list = [...POSTERS, POSTERS[0]];
      list.forEach((p, i) => {
        const th = THEMES[p[5]];
        const right = (i % POSTERS.length) % 2 === 0; // product on the right for even posters (loop copy matches poster 0)
        const stageX = right ? 860 : 60;
        const txtX = right ? 120 : 1060;
        const d = document.createElement("div");
        d.className = "poster";
        d.id = "P" + i;
        d.style.zIndex = 10 + i;
        d.innerHTML =
          '<div class="bg" style="background:' + th.bg + '"></div>' +
          '<div class="halo" style="left:' + (stageX + 10) + "px;background:radial-gradient(circle," + th.halo + ' 0%, rgba(0,0,0,0) 65%)"></div>' +
          '<div class="ring" style="left:' + (stageX + 50) + "px;border-color:" + th.acc + '"></div>' +
          '<div class="stage" style="left:' + stageX + 'px"><img src="assets/img/' + p[4] + '.png" alt="' + p[1] + '"' + (p[4] === 'tielle' ? ' style="max-width:760px"' : '') + ' /></div>' +
          '<div class="txt" style="left:' + txtX + "px;color:" + th.fg + '">' +
          '<div class="cat" style="background:' + th.catBg + ";color:" + th.catFg + '">' + p[0] + "</div>" +
          '<div class="name">' + p[1] + "</div>" +
          '<div class="bar" style="background:' + th.acc + '"></div>' +
          '<div class="tag">' + p[2] + "</div>" +
          (p[3] ? '<div class="price">' + p[3] + "</div>" : "") +
          "</div>";
        host.appendChild(d);
      });

      const tl = gsap.timeline({ paused: true });
      const N = POSTERS.length;
      const posterEls = list.map((_, i) => document.getElementById("P" + i));
      posterEls.forEach((el, i) => gsap.set(el, { autoAlpha: i === 0 ? 1 : 0 }));

      // continuous life on a poster: product breathes, ring turns, halo pulses
      function life(i, t0, dur) {
        const el = posterEls[i];
        const img = el.querySelector(".stage img");
        tl.fromTo(img, { y: 0, rotation: 0 }, { y: -16, rotation: i % 2 ? -1.5 : 1.5, duration: dur / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, t0);
        tl.fromTo(el.querySelector(".ring"), { rotation: 0 }, { rotation: 40, duration: dur, ease: "none" }, t0);
        tl.fromTo(el.querySelector(".halo"), { scale: 0.95 }, { scale: 1.05, duration: dur / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, t0);
      }
      // entrance of the poster's content (skipped for poster 0 and its loop copy, so start frame == end frame)
      function enter(i, t) {
        const el = posterEls[i];
        const q = (s) => el.querySelector(s);
        const fromX = i % 2 === 0 ? 400 : -400;
        tl.fromTo(q(".stage img"), { x: fromX, scale: 0.7, autoAlpha: 0 }, { x: 0, scale: 1, autoAlpha: 1, duration: 0.8, ease: "back.out(1.4)", immediateRender: false }, t);
        tl.fromTo(q(".cat"), { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t + 0.2);
        tl.fromTo(q(".name"), { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, t + 0.3);
        tl.fromTo(q(".bar"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t + 0.6);
        tl.fromTo(q(".tag"), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, immediateRender: false }, t + 0.75);
        if (q(".price")) {
          tl.fromTo(q(".price"), { autoAlpha: 0, scale: 0.3, rotation: -15 }, { autoAlpha: 1, scale: 1, rotation: -3, duration: 0.55, ease: "back.out(2)", immediateRender: false }, t + 1.0);
          tl.to(q(".price"), { scale: 1.07, duration: 0.18, yoyo: true, repeat: 1 }, t + 3.6);
        }
      }
      // transitions: the incoming poster is revealed on top of the outgoing one
      function reveal(i, t, kind) {
        const el = posterEls[i];
        const right = (i % N) % 2 === 0;
        tl.set(el, { autoAlpha: 1 }, t);
        if (kind === "wipe") {
          tl.fromTo(el, { clipPath: right ? "inset(0% 0% 0% 100%)" : "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: TR, ease: "power3.inOut", immediateRender: false }, t);
        } else if (kind === "circle") {
          const cx = right ? "70%" : "30%";
          tl.fromTo(el, { clipPath: "circle(0% at " + cx + " 50%)" }, { clipPath: "circle(150% at " + cx + " 50%)", duration: TR + 0.2, ease: "power2.in", immediateRender: false }, t);
        } else if (kind === "slide") {
          tl.fromTo(el, { yPercent: 100 }, { yPercent: 0, duration: TR, ease: "power3.inOut", immediateRender: false }, t);
        } else {
          tl.fromTo(el, { clipPath: "polygon(0% 0%, 0% 0%, 0% 0%, 0% 0%)" }, { clipPath: "polygon(0% 0%, 200% 0%, 0% 200%, 0% 0%)", duration: TR + 0.1, ease: "power2.inOut", immediateRender: false }, t);
        }
        // hide the previous poster once covered
        tl.set(posterEls[i - 1], { autoAlpha: 0 }, t + TR + 0.25);
      }

      life(0, 0, HOLD);
      for (let i = 1; i <= N; i++) {
        const t = i * HOLD - TR; // transition starts before the slot
        reveal(i, t, KINDS[(i - 1) % KINDS.length]);
        if (i < N) enter(i, t + 0.25);
        life(i, t, HOLD + TR);
      }
      // the logo gives a small bounce at each poster change
      for (let i = 1; i <= N; i++) {
        tl.to("#logo", { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, i * HOLD - 0.1);
      }

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

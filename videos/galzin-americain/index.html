<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      /* THEME — brown, with the poster's bronze medallions and red accent */
      :root {
        --bg-center: #5c3520;
        --bg-edge: #1f1009;
        --yellow: #ffcc4d;
        --cream: #fbe9d7;
        --ink: #2a1407;
        --bronze-a: #e2c29c;
        --bronze-b: #a06e45;
        --red: #d42a2a;
        --ketchup: #c8231c;
        --mustard: #e3a91b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-edge);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--cream);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 58%, var(--bg-center) 0%, var(--bg-edge) 80%);
      }
      #spot {
        position: absolute;
        left: 260px;
        top: 380px;
        width: 1400px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 204, 77, 0.2) 0%, rgba(255, 204, 77, 0) 65%);
      }
      #dots {
        position: absolute;
        inset: 0;
      }
      .dot {
        position: absolute;
        border-radius: 50%;
        border: 3px solid var(--yellow);
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        opacity: 0.55;
      }
      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
      }
      #logo-halo {
        position: absolute;
        inset: -70px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 204, 77, 0.35) 0%, rgba(255, 204, 77, 0) 65%);
      }

      /* Intro line */
      #pre {
        position: absolute;
        left: 200px;
        right: 200px;
        top: 0;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #pre-a {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 60px;
        color: var(--yellow);
      }
      #pre-b {
        font-size: 150px;
        line-height: 1;
        letter-spacing: 4px;
      }

      /* Arched title: each letter sits in a rotated slot on a circle */
      #arch {
        position: absolute;
        inset: 0;
      }
      .slotL {
        position: absolute;
        width: 160px;
        height: 230px;
        margin-left: -80px;
        transform-origin: 50% 100%;
      }
      .ch {
        display: block;
        width: 160px;
        text-align: center;
        font-size: 250px;
        line-height: 0.92;
        color: var(--cream);
        text-shadow: 0 8px 0 var(--red);
      }

      /* Sandwich */
      #sand {
        position: absolute;
        left: 210px;
        top: 450px;
        width: 1500px;
        height: 443px;
      }
      #sand img {
        position: absolute;
        inset: 0;
        width: 1500px;
        height: 443px;
        filter: drop-shadow(0 34px 26px rgba(0, 0, 0, 0.55));
      }

      /* Callouts */
      .call {
        position: absolute;
        font-size: 74px;
        line-height: 1;
        letter-spacing: 2px;
        color: var(--yellow);
        white-space: nowrap;
      }
      #call-frites {
        left: 1560px;
        top: 330px;
      }
      #call-steak {
        left: 200px;
        top: 930px;
      }
      #lines {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #sauces {
        position: absolute;
        left: 780px;
        top: 925px;
        display: flex;
        flex-direction: row;
        gap: 20px;
      }
      .sauce {
        padding: 12px 28px 4px;
        border-radius: 40px;
        font-size: 60px;
        line-height: 1;
        letter-spacing: 2px;
      }
      #s-ketchup {
        background: var(--ketchup);
        color: var(--cream);
      }
      #s-mayo {
        background: var(--cream);
        color: var(--ink);
      }
      #s-moutarde {
        background: var(--mustard);
        color: var(--ink);
      }

      /* Price medallion with two faces */
      #medal {
        position: absolute;
        left: 1170px;
        top: 420px;
        width: 560px;
        height: 380px;
        perspective: 1400px;
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(ellipse at 35% 30%, var(--bronze-a) 0%, var(--bronze-b) 100%);
        box-shadow: 0 26px 50px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        backface-visibility: hidden;
      }
      .face .num {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 180px;
        line-height: 0.9;
      }
      .face .tag {
        font-size: 64px;
        line-height: 1;
        letter-spacing: 3px;
      }
      .face .small {
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 34px;
        margin-top: 6px;
      }

      #fid {
        position: absolute;
        left: 560px;
        top: 870px;
        width: 800px;
        height: 120px;
        border-radius: 70px;
        background: var(--ink);
        border: 4px solid var(--bronze-b);
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 44px;
      }
      #fid-pct {
        font-size: 110px;
        line-height: 1;
        color: var(--yellow);
        padding-top: 8px;
      }
      #fid-txt {
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 38px;
        line-height: 1.05;
        color: var(--cream);
      }
      #fid-txt b {
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        font-size: 50px;
        letter-spacing: 2px;
        color: var(--yellow);
      }

      #end-sub {
        position: absolute;
        left: 1100px;
        width: 700px;
        top: 650px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 50px;
        line-height: 1.15;
        color: var(--yellow);
      }
      #legal {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 40px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 26px;
        color: var(--cream);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="spot"></div>
      <div id="dots"></div>

      <div id="pre">
        <div id="pre-a">Du lundi au vendredi, à la demande :</div>
        <div id="pre-b">DÉCOUVREZ NOTRE SANDWICH</div>
      </div>

      <div id="arch"></div>

      <div id="sand"><img src="assets/img/americain.png" alt="Sandwich américain" /></div>

      <svg id="lines" viewBox="0 0 1920 1080">
        <g fill="none" stroke="#ffcc4d" stroke-width="4" stroke-linecap="round">
          <path id="ln-frites" d="M1600 410 L1480 410 L1340 575" />
          <path id="ln-steak" d="M400 920 L470 820 L560 700" />
        </g>
        <circle id="pt-frites" cx="1340" cy="575" r="11" fill="#ffcc4d" />
        <circle id="pt-steak" cx="560" cy="700" r="11" fill="#ffcc4d" />
      </svg>
      <div class="call" id="call-frites">FRITES</div>
      <div class="call" id="call-steak">STEAK HACHÉ</div>
      <div id="sauces">
        <div class="sauce" id="s-ketchup">KETCHUP</div>
        <div class="sauce" id="s-mayo">MAYONNAISE</div>
        <div class="sauce" id="s-moutarde">MOUTARDE</div>
      </div>

      <div id="medal">
        <div class="face" id="face-a" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">
          <div data-layout-allow-occlusion="true" data-layout-allow-overlap="true" class="num">8,90€</div>
          <div data-layout-allow-occlusion="true" data-layout-allow-overlap="true" class="tag">SEUL</div>
        </div>
        <div class="face" id="face-b" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">
          <div class="tag">FORMULE</div>
          <div class="num">10,50€</div>
          <div class="small">Sandwich + boisson 33 cl*</div>
        </div>
      </div>

      <div id="fid">
        <div id="fid-pct">5%</div>
        <div id="fid-txt">crédités sur votre<br /><b>CARTE DE FIDÉLITÉ</b></div>
      </div>

      <div id="end-sub">Du lundi au vendredi,<br />à la demande</div>

      <div id="logo">
        <div id="logo-halo"></div>
        <img src="assets/img/galzin-logo.png" alt="Galzin" />
      </div>
      <div id="frame"></div>
      <div id="legal">Photos non contractuelles · *Hors boissons alcoolisées</div>
    </div>

    <script>
      // ── Build the arched "AMÉRICAIN" title
      const WORD = "AMÉRICAIN";
      const CX = 960, CY = 1800, R = 1460, STEP = 4.4; // degrees between letters
      const archEl = document.getElementById("arch");
      const letters = [];
      [...WORD].forEach((c, i) => {
        const deg = (i - (WORD.length - 1) / 2) * STEP;
        const rad = (deg * Math.PI) / 180;
        const slot = document.createElement("div");
        slot.className = "slotL";
        slot.style.left = (CX + R * Math.sin(rad)).toFixed(1) + "px";
        slot.style.top = (CY - R * Math.cos(rad) - 230).toFixed(1) + "px";
        slot.style.transform = "rotate(" + deg.toFixed(2) + "deg)";
        const ch = document.createElement("span");
        ch.className = "ch";
        ch.setAttribute("data-layout-allow-overlap", "true");
        ch.textContent = c;
        slot.appendChild(ch);
        archEl.appendChild(slot);
        letters.push(ch);
      });

      let seed = 890;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const dotsEl = document.getElementById("dots");
      const dots = [];
      for (let i = 0; i < 14; i++) {
        const d = document.createElement("div");
        d.className = "dot";
        const size = Math.round(26 + rand() * 40);
        d.style.width = d.style.height = size + "px";
        d.style.left = Math.round(60 + rand() * 1780) + "px";
        d.style.top = Math.round(60 + rand() * 940) + "px";
        dotsEl.appendChild(d);
        dots.push({ el: d, op: 0.08 + rand() * 0.12, dx: -30 + rand() * 60, dy: -40 - rand() * 50 });
      }

      const tl = gsap.timeline({ paused: true });
      dots.forEach((d) => {
        tl.fromTo(d.el, { autoAlpha: 0, x: 0, y: 0 }, { autoAlpha: d.op, x: d.dx, y: d.dy, duration: 15, ease: "none" }, 0);
      });
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.8 }, 0.2);

      // ── Logo intro → top-right corner
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#logo-halo", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.4);
      tl.to("#logo", { x: 790, y: -340, scale: 170 / 360, duration: 0.7, ease: "power3.inOut" }, 1.5);
      tl.to("#logo-halo", { autoAlpha: 0, duration: 0.4 }, 1.5);

      // ── "Du lundi au vendredi… Découvrez notre sandwich"
      tl.fromTo("#pre-a", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.7);
      tl.fromTo("#pre-b", { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 2.0);
      tl.to("#pre", { autoAlpha: 0, y: -80, duration: 0.35, ease: "power2.in" }, 3.1);

      // ── AMÉRICAIN letters drop and bounce, one by one
      tl.fromTo(letters, { autoAlpha: 0, y: -500 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "bounce.out", stagger: 0.07 }, 3.3);

      // ── Sandwich slides in from the right
      tl.fromTo("#sand", { x: 1900, rotation: 6 }, { x: 0, rotation: 0, duration: 0.8, ease: "power3.out" }, 4.1);
      tl.to("#sand", { keyframes: [{ scaleY: 0.94, scaleX: 1.02, duration: 0.09 }, { scaleY: 1, scaleX: 1, duration: 0.25, ease: "back.out(3)" }], transformOrigin: "50% 100%" }, 4.9);
      tl.fromTo("#spot", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8 }, 4.3);

      // ── Ingredient callouts
      const lineDraw = (sel, t) => {
        const len = document.querySelector(sel).getTotalLength();
        tl.fromTo(sel, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, t);
      };
      tl.fromTo("#call-frites", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power2.out" }, 5.4);
      lineDraw("#ln-frites", 5.5);
      tl.fromTo("#pt-frites", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 5.8);
      tl.fromTo("#call-steak", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power2.out" }, 5.9);
      lineDraw("#ln-steak", 6.0);
      tl.fromTo("#pt-steak", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 6.3);
      tl.fromTo(".sauce", { autoAlpha: 0, y: 40, scale: 0.6 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2.5)", stagger: 0.15 }, 6.5);
      tl.to(["#call-frites", "#call-steak", "#lines", "#sauces"], { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 7.9);

      // ── Sandwich steps left, price medallion arrives
      // sandwich centre (960,671) → (620,640), scale .72
      tl.to("#sand", { x: -340, y: -31, scale: 0.72, duration: 0.7, ease: "power3.inOut" }, 8.1);
      tl.to("#spot", { x: -330, duration: 0.7, ease: "power3.inOut" }, 8.1);
      tl.fromTo("#medal", { autoAlpha: 0, scale: 0.3, rotation: -20 }, { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.6, ease: "back.out(1.7)" }, 8.5);
      tl.set("#face-b", { rotationY: 90 }, 0);
      // flip: 8,90 € seul → formule 10,50 €
      tl.to("#face-a", { rotationY: -90, duration: 0.25, ease: "power2.in" }, 9.9);
      tl.fromTo("#face-b", { rotationY: 90 }, { rotationY: 0, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, 10.15);
      tl.to("#medal", { scale: 1.06, duration: 0.15, yoyo: true, repeat: 1 }, 10.5);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 0.8, duration: 0.4 }, 10.2);
      tl.fromTo("#fid", { autoAlpha: 0, y: 160 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 11.0);
      tl.fromTo("#fid-pct", { scale: 0.5 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 11.3);

      // ── End card (12.7 → 15)
      tl.to("#fid", { autoAlpha: 0, y: 60, duration: 0.35, ease: "power2.in" }, 12.7);
      // medallion centre (1450,610) → (1450,880), scale .5
      tl.to("#medal", { y: 270, scale: 0.5, rotation: 0, duration: 0.6, ease: "power3.inOut" }, 12.8);
      // corner logo → right panel: centre (1750,140) → (1450,530), 200px
      tl.to("#logo", { x: 490, y: 50, scale: 200 / 360, duration: 0.6, ease: "power3.inOut" }, 12.8);
      tl.fromTo("#end-sub", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 13.2);
      tl.to(letters, { y: -14, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.04 }, 13.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

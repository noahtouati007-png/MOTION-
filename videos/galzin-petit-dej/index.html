<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      @font-face {
        font-family: "Dancing Script";
        src: url("assets/fonts/dancing-script-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      /* THEME — morning: warm cream, sunrise yellow, coffee brown */
      :root {
        --cream: #fdf3e4;
        --cream-2: #f3dcbb;
        --sun: #ffcc4d;
        --orange: #e8912d;
        --brown: #4a2c19;
        --brown-2: #2f1b0f;
        --bronze-a: #f2c890;
        --bronze-b: #b0743d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--brown);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 120%, #ffe2a6 0%, var(--cream) 55%, var(--cream-2) 100%);
      }
      #sun {
        position: absolute;
        left: 660px;
        top: 640px;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd56b 0%, rgba(255, 204, 77, 0.55) 45%, rgba(255, 204, 77, 0) 70%);
      }
      #rays {
        position: absolute;
        left: -40px;
        top: -260px;
        width: 2000px;
        height: 2000px;
        border-radius: 50%;
        background: repeating-conic-gradient(rgba(255, 204, 77, 0.22) 0deg 6deg, transparent 6deg 12deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.6) 25%, transparent 55%);
        mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.6) 25%, transparent 55%);
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--orange);
        border-radius: 18px;
        opacity: 0.55;
      }
      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
        filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.3));
      }

      #title {
        position: absolute;
        left: 0;
        right: 0;
        top: 54px;
        text-align: center;
      }
      #t-a {
        font-family: "Dancing Script", cursive;
        font-weight: 700;
        font-size: 120px;
        line-height: 1;
        color: var(--orange);
      }
      #t-b {
        margin-top: -6px;
        font-size: 120px;
        line-height: 0.95;
        letter-spacing: 6px;
      }

      /* The equation row */
      .it {
        position: absolute;
        top: 330px;
        width: 330px;
        height: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
      }
      .it .vis {
        width: 330px;
        height: 290px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .it .vis img {
        max-width: 330px;
        max-height: 290px;
        object-fit: contain;
        filter: drop-shadow(0 18px 16px rgba(74, 44, 25, 0.35));
      }
      .it .cup {
        position: relative;
        width: 330px;
      }
      .it .cup img {
        display: block;
        width: 330px;
      }
      .it .cup .smoke {
        position: absolute;
        left: 118px;
        top: -78px;
        filter: none;
      }
      .it .vis svg {
        filter: drop-shadow(0 18px 16px rgba(74, 44, 25, 0.3));
      }
      .it .lbl {
        margin-top: 18px;
        text-align: center;
        font-size: 52px;
        line-height: 1;
        letter-spacing: 2px;
      }
      .it .sub {
        margin-top: 6px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 34px;
        line-height: 1;
        color: #7a5232;
      }
      .op {
        position: absolute;
        top: 470px;
        width: 70px;
        text-align: center;
        font-size: 110px;
        line-height: 1;
        color: #a24c0c;
      }
      #eq {
        position: absolute;
        left: 1500px;
        top: 360px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--bronze-a) 0%, var(--bronze-b) 100%);
        box-shadow: 0 26px 50px rgba(74, 44, 25, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #eq .s {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 40px;
        line-height: 1;
      }
      #eq .p {
        display: flex;
        align-items: flex-start;
        line-height: 0.85;
      }
      #eq .p .u {
        font-size: 210px;
      }
      #eq .p .c {
        font-size: 110px;
        margin-top: 12px;
      }

      /* +1€ viennoiserie */
      #vien {
        position: absolute;
        left: 280px;
        top: 790px;
        width: 1360px;
        height: 200px;
        border-radius: 110px;
        background: var(--brown);
        color: var(--cream);
        display: flex;
        align-items: center;
        padding: 0 50px 0 30px;
        gap: 26px;
        box-shadow: 0 20px 40px rgba(47, 27, 15, 0.35);
      }
      #vien img {
        height: 150px;
        object-fit: contain;
      }
      #vien .plus {
        font-size: 120px;
        line-height: 1;
        color: var(--sun);
        padding-top: 12px;
      }
      #vien .t {
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 52px;
        line-height: 1.05;
      }
      #vien .t i {
        font-weight: 600;
        color: var(--sun);
      }

      /* Supplements */
      #supp {
        position: absolute;
        left: 280px;
        top: 790px;
        width: 1360px;
        height: 200px;
        display: flex;
        gap: 30px;
      }
      .sp {
        flex: 1;
        border-radius: 34px;
        background: var(--cream);
        border: 5px solid var(--brown);
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 26px;
        box-shadow: 0 16px 30px rgba(74, 44, 25, 0.25);
      }
      .sp .duo {
        flex: none;
        width: 170px;
        height: 120px;
        position: relative;
      }
      .sp .duo img {
        position: absolute;
        width: 110px;
        filter: drop-shadow(0 6px 6px rgba(74, 44, 25, 0.35));
      }
      .sp .duo img:first-child {
        left: 0;
        top: 8px;
        transform: rotate(-8deg);
      }
      .sp .duo img + img {
        left: 64px;
        top: 14px;
        width: 100px;
        transform: rotate(10deg);
      }
      .sp .duo img:only-child {
        left: 10px;
        top: 4px;
        transform: none;
      }
      .sp .t {
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 40px;
        line-height: 1.05;
      }
      .sp .t b {
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        font-size: 60px;
        color: #a24c0c;
        letter-spacing: 1px;
      }
      #veil {
        position: absolute;
        inset: 0;
        background: var(--cream);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="rays"></div>
      <div id="sun"></div>

      <div id="title">
        <div id="t-a">Petit-déj</div>
        <div id="t-b">TARTINE</div>
      </div>

      <!-- 1 boisson chaude -->
      <div class="it" id="i1" style="left: 70px">
        <div class="vis">
          <div class="cup">
            <img src="assets/img/cafe.png" alt="Boisson chaude" />
            <svg class="smoke" width="140" height="90" viewBox="0 0 140 90">
              <g fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round">
                <path class="steam" d="M35 85 C 15 65, 55 50, 35 20" />
                <path class="steam" d="M70 85 C 50 65, 90 50, 70 15" />
                <path class="steam" d="M105 85 C 85 65, 125 50, 105 20" />
              </g>
            </svg>
          </div>
        </div>
        <div class="lbl">BOISSON CHAUDE</div>
        <div class="sub">thé, café ou chocolat</div>
      </div>
      <div class="op" id="o1" style="left: 390px">+</div>

      <!-- 1 tartine -->
      <div class="it" id="i2" style="left: 440px">
        <div class="vis"><img src="assets/img/tartine.png" alt="Tartine baguette" /></div>
        <div class="lbl">TARTINE</div>
        <div class="sub">baguette</div>
      </div>
      <div class="op" id="o2" style="left: 760px">+</div>

      <!-- 1 beurre -->
      <div class="it" id="i3" style="left: 810px">
        <div class="vis">
          <img src="assets/img/beurre.png" alt="Beurre individuel" style="max-width: 290px" />
        </div>
        <div class="lbl">BEURRE</div>
        <div class="sub">portion individuelle</div>
      </div>
      <div class="op" id="o3" style="left: 1130px">+</div>

      <!-- 1 confiture -->
      <div class="it" id="i4" style="left: 1180px">
        <div class="vis">
          <img src="assets/img/confiture.png" alt="Confiture individuelle" style="max-width: 232px" />
        </div>
        <div class="lbl">CONFITURE</div>
        <div class="sub">portion individuelle</div>
      </div>
      <div class="op" id="o4" style="left: 1440px; color: #6e3005">=</div>

      <div id="eq">
        <div class="s">la formule</div>
        <div class="p"><span class="u">3</span><span class="c">€80</span></div>
      </div>

      <div id="vien">
        <div class="plus">+1€</div>
        <img src="assets/img/croissant.png" alt="Croissant" />
        <div class="t">un croissant <i>ou</i><br />une chocolatine</div>
        <img src="assets/img/chocolatine.png" alt="Chocolatine" />
      </div>

      <div id="supp">
        <div class="sp" id="sp1">
          <span class="duo"><img src="assets/img/beurre.png" alt="" /><img src="assets/img/confiture.png" alt="" /></span>
          <div class="t">Beurre ou confiture<br />en plus : <b>+0,30€</b></div>
        </div>
        <div class="sp" id="sp2">
          <span class="duo"><img src="assets/img/cafe.png" alt="" style="width: 150px" /></span>
          <div class="t">Café latte :<br /><b>+0,30€</b></div>
        </div>
      </div>

      <div id="logo"><img src="assets/img/galzin-logo.png" alt="Galzin" /></div>
      <div id="frame"></div>
      <div id="veil"></div>
    </div>

    <script>
      gsap.set(["#veil", "#supp", ".sp"], { autoAlpha: 0 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.8 }, 0.2);
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 30, duration: 15, ease: "none" }, 0);

      // ── Sunrise + logo → corner
      tl.fromTo("#sun", { y: 300, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 1.4, ease: "power2.out" }, 0);
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.1);
      tl.to("#logo", { x: 790, y: -340, scale: 170 / 360, duration: 0.7, ease: "power3.inOut" }, 1.2);

      // ── Title: "Petit-déj" writes itself, TARTINE stamps
      tl.fromTo("#t-a", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power1.inOut" }, 1.5);
      tl.fromTo("#t-b", { autoAlpha: 0, scale: 1.7 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power4.in" }, 2.0);

      // ── The equation builds (2.6 → 7.2)
      const items = ["#i1", "#i2", "#i3", "#i4"], ops = ["#o1", "#o2", "#o3", "#o4"];
      items.forEach((sel, i) => {
        const t = 2.6 + i * 0.95;
        tl.fromTo(sel + " .vis", { autoAlpha: 0, y: -500, rotation: i % 2 ? 10 : -10 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }, t);
        tl.fromTo(sel + " .lbl", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" }, t + 0.35);
        tl.fromTo(sel + " .sub", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, t + 0.5);
        tl.fromTo(ops[i], { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t + 0.6);
      });
      tl.fromTo(".steam", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: -6, duration: 0.8, ease: "sine.inOut", stagger: 0.15 }, 3.0);
      tl.to(".steam", { y: -16, autoAlpha: 0.35, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.2 }, 3.9);
      tl.fromTo("#eq", { autoAlpha: 0, scale: 0.2, rotation: -60 }, { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.6, ease: "back.out(1.8)" }, 6.5);
      tl.to("#eq", { scale: 1.08, duration: 0.16, yoyo: true, repeat: 1 }, 7.3);

      // ── +1€ croissant ou chocolatine (7.8 → 10.6)
      tl.fromTo("#vien", { autoAlpha: 0, y: 260 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, 7.8);
      tl.fromTo("#vien img", { scale: 0.3, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)", stagger: 0.15 }, 8.1);
      tl.fromTo("#vien .plus", { scale: 0.3 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 8.0);
      tl.to("#vien", { autoAlpha: 0, y: 200, duration: 0.4, ease: "power2.in" }, 10.6);

      // ── Supplements (10.9 → 14.4)
      tl.set("#supp", { autoAlpha: 1 }, 10.9);
      tl.fromTo(".sp", { autoAlpha: 0, y: 160, scale: 0.85 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.18 }, 10.9);
      tl.to(".sp b", { scale: 1.1, duration: 0.16, yoyo: true, repeat: 1, stagger: 0.25 }, 12.0);
      tl.to("#eq", { scale: 1.08, duration: 0.16, yoyo: true, repeat: 1 }, 13.0);
      tl.to("#logo", { scale: 210 / 360, x: 770, y: -320, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 1 }, 13.6);

      // ── Clean exit for the loop
      tl.to("#veil", { autoAlpha: 1, duration: 0.55, ease: "power1.inOut" }, 14.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

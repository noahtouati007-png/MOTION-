<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      /* THEME — swap these to change the ad's colour world */
      :root {
        --bg-center: #8a1f17;
        --bg-edge: #3d0906;
        --dot: #ffcc4d;
        --yellow: #ffcc4d;
        --cream: #f6efe4;
        --ink: #2a1d12;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-edge);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--cream);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 38% 45%, var(--bg-center) 0%, var(--bg-edge) 75%);
      }
      #dots {
        position: absolute;
        inset: 0;
      }
      .dot {
        position: absolute;
        border-radius: 50%;
        border: 3px solid var(--dot);
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        opacity: 0.55;
      }

      /* Logo (one element: intro hero → corner → end card) */
      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
      }
      #logo-halo {
        position: absolute;
        inset: -70px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 204, 77, 0.35) 0%, rgba(255, 204, 77, 0) 65%);
      }

      /* Product stage (left) */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 900px;
        height: 1080px;
      }
      #halo-ring {
        position: absolute;
        left: 20px;
        top: 90px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        border: 2px dashed var(--yellow);
        opacity: 0.45;
      }
      #pizzas {
        position: absolute;
        left: 0;
        top: -30px;
        width: 690px;
        height: 1140px;
      }
      .bottle {
        position: absolute;
        bottom: 150px;
      }
      #coca {
        left: 1120px;
        width: 140px;
        height: 468px;
      }
      #vin {
        left: 1440px;
        width: 140px;
        height: 545px;
      }
      #ou {
        position: absolute;
        left: 1315px;
        top: 640px;
        width: 80px;
        font-size: 80px;
        color: var(--yellow);
        text-align: center;
      }

      /* Text scenes (right) */
      .panel {
        position: absolute;
        left: 880px;
        right: 100px;
        top: 0;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .big {
        font-size: 190px;
        line-height: 0.95;
        letter-spacing: 3px;
      }
      .mid {
        font-size: 104px;
        line-height: 1;
        letter-spacing: 2px;
        color: var(--yellow);
      }
      .bar {
        width: 360px;
        height: 10px;
        border-radius: 5px;
        background: var(--yellow);
        margin: 18px 0 26px;
      }
      #p2 {
        justify-content: flex-start;
        padding-top: 215px;
      }
      #p2 .big {
        font-size: 130px;
      }
      #p2 .plus {
        color: var(--yellow);
      }

      /* Price badge */
      #badge {
        position: absolute;
        left: 1150px;
        top: 250px;
        width: 560px;
        height: 560px;
      }
      #badge svg {
        position: absolute;
        inset: 0;
        width: 560px;
        height: 560px;
      }
      #badge-text {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--ink);
      }
      #badge-top {
        font-size: 58px;
        letter-spacing: 4px;
      }
      #badge-price {
        font-size: 230px;
        line-height: 0.85;
      }
      #badge-bottom {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 50px;
      }

      /* End card */
      #p4 {
        justify-content: flex-start;
        padding-top: 330px;
      }
      #end-title {
        font-size: 128px;
        line-height: 1;
        letter-spacing: 3px;
      }
      #end-sub {
        margin-top: 14px;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 48px;
        color: var(--yellow);
      }

      #legal {
        position: absolute;
        left: 880px;
        right: 100px;
        bottom: 56px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 28px;
        color: var(--cream);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <div id="dots"></div>

      <div id="stage">
        <div id="halo-ring"></div>
        <img id="pizzas" src="assets/img/pizzas.png" alt="3 pizzas XL" />
      </div>

      <div class="panel" id="p1">
        <div class="big" id="t-3pizzas">3 PIZZAS XL</div>
        <div class="bar" id="bar1"></div>
        <div class="mid" id="t-choix">(32 CM) AU CHOIX</div>
      </div>

      <div class="panel" id="p2">
        <div class="big" id="t-boisson"><span class="plus">+</span> 1 BOISSON</div>
      </div>
      <img class="bottle" id="coca" src="assets/img/coca.png" alt="Coca-Cola" />
      <div id="ou">OU</div>
      <img class="bottle" id="vin" src="assets/img/vin.png" alt="Vin rouge" />

      <div id="badge">
        <svg viewBox="0 0 560 560">
          <polygon id="burst" fill="#ffcc4d" points="" />
          <circle cx="280" cy="280" r="214" fill="none" stroke="#2a1d12" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round" />
        </svg>
        <div id="badge-text">
          <div id="badge-top">LA FORMULE</div>
          <div id="badge-price">25€</div>
          <div id="badge-bottom">TTC</div>
        </div>
      </div>

      <div class="panel" id="p4">
        <div id="end-title">L'OFFRE PIZZA</div>
        <div id="end-sub">3 pizzas XL au choix + 1 boisson</div>
      </div>

      <div id="logo">
        <div id="logo-halo"></div>
        <img src="assets/img/galzin-logo.png" alt="Galzin" />
      </div>

      <div id="frame"></div>
      <div id="legal">L'abus d'alcool est dangereux pour la santé. À consommer avec modération.</div>
    </div>

    <script>
      // Starburst points (24 spikes)
      const pts = [];
      for (let i = 0; i < 48; i++) {
        const r = i % 2 ? 248 : 276;
        const a = (i / 48) * Math.PI * 2;
        pts.push((280 + r * Math.cos(a)).toFixed(1) + "," + (280 + r * Math.sin(a)).toFixed(1));
      }
      document.getElementById("burst").setAttribute("points", pts.join(" "));

      // Deterministic bokeh rings
      let seed = 1938;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const dotsEl = document.getElementById("dots");
      const dots = [];
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("div");
        d.className = "dot";
        const size = Math.round(26 + rand() * 40);
        d.style.width = d.style.height = size + "px";
        d.style.left = Math.round(60 + rand() * 1780) + "px";
        d.style.top = Math.round(60 + rand() * 940) + "px";
        dotsEl.appendChild(d);
        dots.push({ el: d, op: 0.1 + rand() * 0.14, dx: -30 + rand() * 60, dy: -40 - rand() * 50 });
      }

      const tl = gsap.timeline({ paused: true });

      dots.forEach((d) => {
        tl.fromTo(d.el, { autoAlpha: 0, x: 0, y: 0 }, { autoAlpha: d.op, x: d.dx, y: d.dy, duration: 15, ease: "none" }, 0);
      });
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.8 }, 0.2);

      // ── S0 · Logo intro (0 → 2.4s)
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#logo-halo", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.4);
      // to the top-right corner: centre (960,480) → (1750,140), 360px → 170px
      tl.to("#logo", { x: 790, y: -340, scale: 170 / 360, duration: 0.7, ease: "power3.inOut" }, 1.9);
      tl.to("#logo-halo", { autoAlpha: 0, duration: 0.4 }, 1.9);

      // ── S1 · 3 pizzas XL (2.3 → 6s)
      tl.fromTo("#pizzas", { x: -720, rotation: -10, autoAlpha: 1 }, { x: 0, rotation: 0, duration: 0.9, ease: "back.out(1.2)" }, 2.3);
      tl.fromTo("#halo-ring", { autoAlpha: 0, scale: 0.8, rotation: 0 }, { autoAlpha: 0.45, scale: 1, rotation: 25, duration: 1.2, ease: "power2.out" }, 2.6);
      tl.to("#halo-ring", { rotation: 90, duration: 11, ease: "none" }, 3.8);
      tl.fromTo("#t-3pizzas", { autoAlpha: 0, y: 70 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.9);
      tl.fromTo("#bar1", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 3.25);
      tl.fromTo("#t-choix", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.7);
      tl.to("#pizzas", { scale: 1.03, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "30% 50%" }, 4.2);
      tl.to("#p1", { autoAlpha: 0, y: -60, duration: 0.4, ease: "power2.in" }, 5.8);

      // ── S2 · + 1 boisson (6.1 → 9.2s)
      tl.fromTo("#p2", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.1);
      tl.fromTo("#coca", { autoAlpha: 0, y: 260, rotation: -8 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.5)" }, 6.4);
      tl.fromTo("#ou", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 6.8);
      tl.fromTo("#vin", { autoAlpha: 0, y: 260, rotation: 8 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.6, ease: "back.out(1.5)" }, 6.95);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 0.85, duration: 0.5 }, 6.95);
      tl.to(["#p2", "#ou"], { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 8.9);
      tl.to("#coca", { autoAlpha: 0, x: -80, y: 120, duration: 0.4, ease: "power2.in" }, 8.9);
      tl.to("#vin", { autoAlpha: 0, x: 80, y: 120, duration: 0.4, ease: "power2.in" }, 8.95);

      // ── S3 · Price badge (9.3 → 12.2s)
      tl.fromTo("#badge", { autoAlpha: 0, scale: 0.3, rotation: -40 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.75, ease: "back.out(1.7)" }, 9.3);
      tl.fromTo("#badge svg", { rotation: 0 }, { rotation: 30, duration: 5.7, ease: "none" }, 9.3);
      tl.to("#badge", { scale: 1.07, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 10.4);

      // ── S4 · End card (12.2 → 15s)
      tl.to("#badge", { x: -80, y: 250, scale: 0.42, duration: 0.7, ease: "power3.inOut" }, 12.2);
      // corner logo → above the title: centre (1750,140) → (1350,190), 170px → 220px
      tl.to("#logo", { x: 390, y: -290, scale: 220 / 360, duration: 0.7, ease: "power3.inOut" }, 12.2);
      tl.fromTo("#end-title", { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 12.55);
      tl.fromTo("#end-sub", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 12.75);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

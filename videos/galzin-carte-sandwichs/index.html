<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      /* THEME — chocolate band over a beige page, teal accents (sandwich/panini poster family) */
      :root {
        --brown: #432818;
        --beige: #f4e5d0;
        --beige-2: #e7d2b4;
        --cream: #fdf2e6;
        --ink: #3a2213;
        --teal: #2c6b69;
        --teal-b: #7cc7bb;
        --yellow: #ffcc4d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--beige);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--ink);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 60%, var(--beige) 0%, var(--beige-2) 90%);
      }
      #band {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--teal);
        border-radius: 18px;
        opacity: 0.5;
      }
      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
        filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.35));
      }
      #title {
        position: absolute;
        left: 0;
        right: 0;
        top: 50px;
        text-align: center;
        color: var(--cream);
      }
      #t-a {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 54px;
        line-height: 1;
        color: var(--yellow);
      }
      #t-b {
        font-size: 120px;
        line-height: 0.95;
        letter-spacing: 6px;
      }

      /* Showcase */
      .sw {
        position: absolute;
        left: 260px;
        top: 300px;
        width: 1400px;
        height: 520px;
      }
      .sw img {
        position: absolute;
        inset: 0;
        width: 1400px;
        height: 520px;
        object-fit: contain;
        filter: drop-shadow(0 30px 24px rgba(58, 34, 19, 0.4));
      }
      .info {
        position: absolute;
        left: 0;
        right: 0;
        top: 830px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .info .n {
        padding: 6px 44px 2px;
        border-radius: 60px;
        background: var(--brown);
        color: var(--cream);
        font-size: 96px;
        line-height: 1;
        letter-spacing: 3px;
      }
      .info .i {
        margin-top: 14px;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 46px;
        line-height: 1;
        color: var(--ink);
      }

      /* Grid */
      .cell {
        position: absolute;
        width: 560px;
        height: 330px;
        border-radius: 30px;
        background: var(--cream);
        box-shadow: 0 14px 30px rgba(58, 34, 19, 0.25);
      }
      .cell img {
        position: absolute;
        left: 20px;
        top: 20px;
        width: 520px;
        height: 210px;
        object-fit: contain;
      }
      .cell .cn {
        position: absolute;
        left: 0;
        right: 0;
        top: 238px;
        text-align: center;
        font-size: 64px;
        line-height: 1;
        letter-spacing: 2px;
      }
      #g-title {
        position: absolute;
        left: 0;
        right: 0;
        top: 70px;
        text-align: center;
        font-size: 110px;
        line-height: 1;
        letter-spacing: 6px;
        color: var(--cream);
      }
      #g-title span {
        color: var(--yellow);
      }
      #veil {
        position: absolute;
        inset: 0;
        background: var(--beige);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="22"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <svg id="band" viewBox="0 0 1920 1080">
        <path fill="#432818" d="M0 0 H1920 V250 C 1600 320, 1300 190, 960 250 S 360 310, 0 220 Z" />
      </svg>
      <div id="title">
        <div id="t-a">Faits maison, chaque jour</div>
        <div id="t-b">NOS SANDWICHS</div>
      </div>
      <div id="show"></div>
      <div id="g-title">NOS <span>SANDWICHS</span></div>
      <div id="grid"></div>
      <div id="logo"><img src="assets/img/galzin-logo.png" alt="Galzin" /></div>
      <div id="frame"></div>
      <div id="veil"></div>
    </div>

    <script>
      // ── Sandwich list (edit names / ingredients here)
      const SW = [
        ["L'Italien", "Pain aux graines, viande séchée, poivrons, copeaux de fromage, salade", "italien"],
        ["Chèvre Noix", "Pain aux graines, jambon cru, chèvre, noix, salade", "chevre-noix"],
        ["Le Mixte", "Jambon blanc, emmental", "mixte"],
        ["Le Parisien", "Jambon blanc, cornichons", "parisien"],
        ["Reblochon", "Pain aux graines, jambon cru, reblochon, oignons rouges, salade", "reblochon"],
        ["Poulet Kebab", "Poulet kebab, concombre, salade", "poulet-kebab"],
      ];
      const show = document.getElementById("show");
      const grid = document.getElementById("grid");
      SW.forEach((s, i) => {
        show.insertAdjacentHTML(
          "beforeend",
          '<div class="sw" id="sw' + i + '"><img src="assets/img/' + s[2] + '.png" alt="' + s[0] + '" /></div>' +
            '<div class="info" id="in' + i + '"><div class="n">' + s[0].toUpperCase() + '</div><div class="i">' + s[1] + "</div></div>"
        );
        const col = i % 3, row = Math.floor(i / 3);
        grid.insertAdjacentHTML(
          "beforeend",
          '<div class="cell" id="g' + i + '" style="left:' + (90 + col * 590) + "px;top:" + (300 + row * 360) + 'px">' +
            '<img src="assets/img/' + s[2] + '.png" alt="" /><div class="cn">' + s[0].toUpperCase() + "</div></div>"
        );
      });

      const sws = SW.map((_, i) => "#sw" + i), ins = SW.map((_, i) => "#in" + i), gs = SW.map((_, i) => "#g" + i);
      gsap.set([...sws, ...ins, ...gs, "#g-title", "#veil"], { autoAlpha: 0 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.5, duration: 0.8 }, 0.2);

      // ── Logo intro → corner, band, title
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.1);
      tl.to("#logo", { x: 790, y: -340, scale: 170 / 360, duration: 0.7, ease: "power3.inOut" }, 1.2);
      tl.fromTo("#band", { y: -340 }, { y: 0, duration: 0.7, ease: "power3.out" }, 1.3);
      tl.fromTo("#t-a", { autoAlpha: 0, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.6);
      tl.fromTo("#t-b", { autoAlpha: 0, scale: 1.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power4.in" }, 1.85);

      // ── Showcase: each sandwich slides across like on a counter (2.5 → 15.1)
      const STEP = 2.1;
      SW.forEach((_, i) => {
        const t = 2.5 + i * STEP;
        const dir = i % 2 ? -1 : 1;
        tl.fromTo(sws[i], { autoAlpha: 1, x: 1900 * dir, rotation: 4 * dir }, { x: 0, rotation: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, t);
        tl.to(sws[i], { keyframes: [{ scaleY: 0.95, scaleX: 1.02, duration: 0.07 }, { scaleY: 1, scaleX: 1, duration: 0.2, ease: "back.out(3)" }], transformOrigin: "50% 100%" }, t + 0.55);
        tl.fromTo(ins[i], { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, t + 0.35);
        tl.to(sws[i], { x: -1900 * dir, rotation: -4 * dir, duration: 0.45, ease: "power3.in" }, t + STEP - 0.3);
        tl.to(ins[i], { autoAlpha: 0, y: -30, duration: 0.25, ease: "power2.in" }, t + STEP - 0.3);
        tl.set(sws[i], { autoAlpha: 0 }, t + STEP + 0.16);
      });

      // ── Grid recap (15.2 → 21.4)
      const tg = 2.5 + SW.length * STEP + 0.1;
      tl.to("#title", { autoAlpha: 0, y: -50, duration: 0.3, ease: "power2.in" }, tg - 0.3);
      tl.fromTo("#g-title", { autoAlpha: 0, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, tg);
      SW.forEach((_, i) => {
        tl.fromTo(gs[i], { autoAlpha: 0, y: 80, scale: 0.85 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, tg + 0.25 + i * 0.12);
        tl.to(gs[i] + " img", { scale: 1.06, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, tg + 1.6 + i * 0.45);
      });
      tl.to("#logo", { scale: 210 / 360, x: 770, y: -320, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 1 }, 20.6);

      // ── Clean exit for the loop
      tl.to("#veil", { autoAlpha: 1, duration: 0.55, ease: "power1.inOut" }, 21.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

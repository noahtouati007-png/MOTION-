<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      :root {
        --bg-center: #5e1d52;
        --bg-edge: #22081f;
        --yellow: #ffcc4d;
        --cream: #f6efe4;
        --white: #ffffff;
        --ink: #2a1d12;
        /* poster colours */
        --orange: #f9b234;
        --pink: #d45599;
        --blue: #35bee8;
        --red: #e30613;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-edge);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--cream);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, var(--bg-center) 0%, var(--bg-edge) 78%);
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        opacity: 0.55;
      }

      /* Intro title */
      #intro {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        font-size: 230px;
        line-height: 1;
        letter-spacing: 4px;
      }
      #intro .w {
        display: inline-block;
      }
      #intro .accent {
        color: var(--yellow);
      }

      /* Three slanted panels, like the poster's colour fields */
      .panel {
        position: absolute;
        inset: 0;
      }
      #pan-sale {
        background: var(--orange);
        clip-path: polygon(0 0, 700px 0, 600px 1080px, 0 1080px);
      }
      #pan-sucre {
        background: var(--pink);
        clip-path: polygon(700px 0, 1320px 0, 1220px 1080px, 600px 1080px);
      }
      #pan-boisson {
        background: var(--blue);
        clip-path: polygon(1320px 0, 1920px 0, 1920px 1080px, 1220px 1080px);
      }
      .zone {
        position: absolute;
        top: 0;
        width: 560px;
        height: 1080px;
      }
      #pan-sale .zone {
        left: 50px;
      }
      #pan-sucre .zone {
        left: 680px;
      }
      #pan-boisson .zone {
        left: 1310px;
      }
      .hdr {
        position: absolute;
        left: 0;
        right: 0;
        top: 80px;
        text-align: center;
        font-size: 120px;
        line-height: 1;
        letter-spacing: 3px;
        color: var(--white);
        text-shadow: 0 6px 0 rgba(0, 0, 0, 0.12);
      }
      .caps {
        position: absolute;
        left: 0;
        right: 0;
        top: 210px;
        height: 60px;
      }
      .cap {
        position: absolute;
        inset: 0;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 44px;
        color: var(--white);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }
      .slot {
        position: absolute;
        left: 50px;
        right: 50px;
        top: 330px;
        height: 420px;
      }
      .slot img {
        position: absolute;
        inset: 0;
        width: 460px;
        height: 420px;
        object-fit: contain;
        filter: drop-shadow(0 22px 18px rgba(0, 0, 0, 0.3));
      }

      /* Red price circle (from the poster) */
      #price {
        position: absolute;
        left: 680px;
        top: 240px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      }
      #price-ring {
        position: absolute;
        inset: 22px;
        border-radius: 50%;
        border: 5px solid var(--white);
      }
      #price-text {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--white);
      }
      #price-big {
        font-size: 250px;
        line-height: 0.82;
      }
      #price-big small {
        font-size: 140px;
      }
      #price-eq {
        font-size: 90px;
        line-height: 0.8;
      }
      #price-sub {
        font-size: 92px;
        line-height: 0.95;
        letter-spacing: 2px;
      }

      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
      }
      #end {
        position: absolute;
        left: 300px;
        right: 300px;
        top: 330px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #end-title {
        font-size: 132px;
        line-height: 1;
        letter-spacing: 3px;
      }
      #end-sub {
        margin-top: 12px;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 48px;
        color: var(--yellow);
      }
      #legal {
        position: absolute;
        left: 70px;
        bottom: 52px;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 26px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>

      <div id="intro">
        <span class="w">COMPOSE</span><span class="w">TON</span><span class="w">MENU</span><span class="w accent">!</span>
      </div>

      <div class="panel" id="pan-sale">
        <div class="zone">
          <div class="hdr">1 SALÉ</div>
          <div class="caps">
            <div class="cap c-sale">Quart de pizza au choix</div>
            <div class="cap c-sale">Sandwich parisien ou mixte</div>
            <div class="cap c-sale">Croque jambon ou fromages</div>
          </div>
          <div class="slot">
            <img class="i-sale" src="assets/img/pizza.png" alt="Quart de pizza" />
            <img class="i-sale" src="assets/img/sandwich.png" alt="Sandwich" />
            <img class="i-sale" src="assets/img/croque.png" alt="Croque" />
          </div>
        </div>
      </div>
      <div class="panel" id="pan-sucre">
        <div class="zone">
          <div class="hdr">1 SUCRÉ</div>
          <div class="caps">
            <div class="cap c-sucre">Donut</div>
            <div class="cap c-sucre">Croissant pur beurre</div>
            <div class="cap c-sucre">Chocolatine pur beurre</div>
          </div>
          <div class="slot">
            <img class="i-sucre" src="assets/img/donut.png" alt="Donut" />
            <img class="i-sucre" src="assets/img/croissant.png" alt="Croissant" />
            <img class="i-sucre" src="assets/img/chocolatine.png" alt="Chocolatine" />
          </div>
        </div>
      </div>
      <div class="panel" id="pan-boisson">
        <div class="zone">
          <div class="hdr">1 BOISSON</div>
          <div class="caps"><div class="cap">Canette 33 cl ou eau 50 cl</div></div>
          <div class="slot"><img id="i-cans" src="assets/img/canettes.png" alt="Boissons" /></div>
        </div>
      </div>

      <div id="price">
        <div id="price-ring"></div>
        <div id="price-text">
          <div id="price-big">5<small>€50</small></div>
          <div id="price-eq">=</div>
          <div id="price-sub">3 PRODUITS</div>
        </div>
      </div>

      <div id="end">
        <div id="end-title">COMPOSE TON MENU !</div>
        <div id="end-sub">1 salé + 1 sucré + 1 boisson</div>
      </div>

      <div id="logo"><img src="assets/img/galzin-logo.png" alt="Galzin" /></div>
      <div id="frame"></div>
      <div id="legal">Photos non contractuelles</div>
    </div>

    <script>
      const sale = [...document.querySelectorAll(".i-sale")];
      const sucre = [...document.querySelectorAll(".i-sucre")];
      const capSale = [...document.querySelectorAll(".c-sale")];
      const capSucre = [...document.querySelectorAll(".c-sucre")];
      // first option of each carousel visible, the others wait their turn
      [sale, sucre, capSale, capSucre].forEach((g) => g.forEach((el, i) => gsap.set(el, { autoAlpha: i ? 0 : 1 })));

      const tl = gsap.timeline({ paused: true });
      const NR = { immediateRender: false };
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.8 }, 0.2);

      // ── Logo intro → bottom-right corner
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.6)" }, 0.1);
      // centre (960,480) → (1780,950), 360px → 150px
      tl.to("#logo", { x: 820, y: 470, scale: 150 / 360, duration: 0.6, ease: "power3.inOut" }, 1.2);

      // ── Kinetic title, word by word
      tl.fromTo("#intro .w", { autoAlpha: 0, y: 120, scale: 0.7 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.16 }, 1.45);
      tl.to("#intro", { autoAlpha: 0, scale: 1.25, duration: 0.35, ease: "power2.in" }, 2.75);

      // ── Panels sweep up, poster-style
      tl.fromTo("#pan-sale", { y: 1100 }, { y: 0, duration: 0.6, ease: "power3.out" }, 2.85);
      tl.fromTo("#pan-sucre", { y: -1100 }, { y: 0, duration: 0.6, ease: "power3.out" }, 3.0);
      tl.fromTo("#pan-boisson", { y: 1100 }, { y: 0, duration: 0.6, ease: "power3.out" }, 3.15);
      tl.fromTo(".hdr", { autoAlpha: 0, y: -60 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(2)", stagger: 0.12 }, 3.5);
      tl.fromTo(".slot", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)", stagger: 0.12 }, 3.6);
      tl.fromTo(".caps", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, stagger: 0.12 }, 3.85);
      tl.fromTo("#i-cans", { y: 0, rotation: 0 }, { y: -14, rotation: 3, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 9 }, 4.2);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 3.6);
      tl.to("#legal", { color: "#f6efe4", duration: 0.3 }, 11.6);

      function carousel(items, caps, start, period, until) {
        let cur = 0;
        for (let t = start; t < until; t += period) {
          const nxt = (cur + 1) % items.length;
          tl.fromTo(items[cur], { autoAlpha: 1, x: 0, rotation: 0 }, { autoAlpha: 0, x: -160, rotation: -15, duration: 0.22, ease: "power2.in", ...NR }, t);
          tl.fromTo(items[nxt], { autoAlpha: 0, x: 160, rotation: 15 }, { autoAlpha: 1, x: 0, rotation: 0, duration: 0.32, ease: "back.out(1.6)", ...NR }, t + 0.14);
          tl.fromTo(caps[cur], { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.15, ...NR }, t);
          tl.fromTo(caps[nxt], { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: "power2.out", ...NR }, t + 0.16);
          cur = nxt;
        }
      }
      carousel(sale, capSale, 4.7, 1.0, 11.2);
      carousel(sucre, capSucre, 5.2, 1.0, 11.2);

      // ── Red price circle: hero moment, then docks at the bottom
      tl.fromTo("#price", { autoAlpha: 0, scale: 0, rotation: -120 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.4)" }, 5.9);
      tl.fromTo("#price-ring", { scale: 1.15, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 6.4);
      tl.to("#price", { scale: 1.07, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 7.1);
      // centre (960,520) → (960,915), scale .45
      tl.to("#price", { y: 395, scale: 0.45, duration: 0.6, ease: "power3.inOut" }, 8.4);
      tl.to("#price", { scale: 0.5, duration: 0.15, yoyo: true, repeat: 1 }, 10.0);

      // ── End card: panels fall away, back to the Galzin world
      tl.to("#pan-sale", { y: 1100, duration: 0.55, ease: "power3.in" }, 11.4);
      tl.to("#pan-sucre", { y: -1100, duration: 0.55, ease: "power3.in" }, 11.5);
      tl.to("#pan-boisson", { y: 1100, duration: 0.55, ease: "power3.in" }, 11.6);
      // price → under the end title: centre (960,520) → (960,790), scale .5
      tl.to("#price", { y: 270, scale: 0.5, duration: 0.6, ease: "power3.inOut" }, 11.8);
      // corner logo → top centre: (960,200), 220px
      tl.to("#logo", { x: 0, y: -280, scale: 220 / 360, duration: 0.6, ease: "power3.inOut" }, 11.8);
      tl.fromTo("#end-title", { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 12.2);
      tl.fromTo("#end-sub", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 12.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

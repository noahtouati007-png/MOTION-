<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      /* THEME — the sandwich/panini poster: chocolate band, cream page, teal price ovals */
      :root {
        --brown: #432818;
        --cream: #fdf2e6;
        --cream-2: #f4e3cf;
        --paper: #fffdf8;
        --ink: #3a2213;
        --teal-a: #4b9b98;
        --teal-b: #7cc7bb;
        --yellow: #ffcc4d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--cream);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--ink);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 30% 65%, var(--cream) 0%, var(--cream-2) 90%);
      }
      #band {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--teal-a);
        border-radius: 18px;
        opacity: 0.55;
      }
      #logo {
        position: absolute;
        left: 780px;
        top: 300px;
        width: 360px;
        height: 360px;
      }
      #logo img {
        position: absolute;
        inset: 0;
        width: 360px;
        height: 360px;
        filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.35));
      }

      #title {
        position: absolute;
        left: 110px;
        top: 50px;
        width: 1300px;
        color: var(--cream);
      }
      #t-a {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 56px;
        line-height: 1;
      }
      #t-b {
        font-size: 150px;
        line-height: 0.95;
        letter-spacing: 3px;
        white-space: nowrap;
      }
      #t-b .ou {
        font-size: 80px;
        letter-spacing: 1px;
        color: var(--yellow);
      }

      /* Products */
      .prod {
        position: absolute;
        filter: drop-shadow(0 22px 18px rgba(58, 34, 19, 0.35));
      }
      #sand {
        left: 70px;
        top: 330px;
        width: 760px;
        height: 490px;
      }
      #can {
        left: 790px;
        top: 470px;
        width: 160px;
        height: 302px;
      }
      #donut {
        left: 230px;
        top: 745px;
        width: 330px;
        height: 263px;
      }

      /* Receipt */
      #ticket {
        position: absolute;
        left: 1110px;
        top: 300px;
        width: 620px;
        height: 700px;
      }
      #paper {
        position: absolute;
        inset: 0;
        background: var(--paper);
        box-shadow: 0 26px 50px rgba(58, 34, 19, 0.3);
        clip-path: polygon(0 0, 100% 0, 100% 97%, 95% 100%, 90% 97%, 85% 100%, 80% 97%, 75% 100%, 70% 97%, 65% 100%, 60% 97%, 55% 100%, 50% 97%, 45% 100%, 40% 97%, 35% 100%, 30% 97%, 25% 100%, 20% 97%, 15% 100%, 10% 97%, 5% 100%, 0 97%);
      }
      #t-head {
        position: absolute;
        left: 0;
        right: 0;
        top: 30px;
        text-align: center;
        font-size: 58px;
        letter-spacing: 8px;
        line-height: 1;
      }
      .dash {
        position: absolute;
        left: 40px;
        right: 40px;
        height: 0;
        border-top: 4px dashed rgba(58, 34, 19, 0.45);
      }
      #d1 {
        top: 102px;
      }
      #d2 {
        top: 400px;
      }
      .row {
        position: absolute;
        left: 46px;
        right: 46px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 64px;
        line-height: 1;
      }
      .row .r {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 40px;
        color: var(--teal-a);
      }
      #r1 {
        top: 140px;
      }
      #r2 {
        top: 225px;
      }
      #r3 {
        top: 310px;
      }
      #tot-l {
        position: absolute;
        left: 46px;
        top: 440px;
        font-size: 60px;
        line-height: 1;
        letter-spacing: 3px;
      }
      #oval {
        position: absolute;
        left: 150px;
        top: 500px;
        width: 400px;
        height: 150px;
        border-radius: 50%;
        background: linear-gradient(100deg, var(--teal-a) 0%, var(--teal-b) 55%, var(--teal-a) 100%);
        overflow: hidden;
      }
      .price {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 150px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 130px;
        line-height: 150px;
        color: var(--ink);
      }

      /* Formula captions on the left */
      .cap {
        position: absolute;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 700;
        font-size: 64px;
        line-height: 1;
        color: var(--ink);
      }
      #cap-can {
        left: 790px;
        top: 790px;
        width: 220px;
        text-align: center;
        font-size: 44px;
      }
      #cap-don {
        left: 580px;
        top: 870px;
        font-size: 44px;
      }
      #legal {
        position: absolute;
        left: 60px;
        bottom: 42px;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 24px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg"></div>
      <svg id="band" viewBox="0 0 1920 1080">
        <path fill="#432818" d="M0 0 H1920 V170 C 1600 300, 1300 200, 960 270 S 360 330, 0 250 Z" />
      </svg>

      <div id="title">
        <div id="t-a">Découvrez notre offre</div>
        <div id="t-b">SANDWICH <span class="ou">OU</span> PANINI</div>
      </div>

      <img class="prod" id="sand" src="assets/img/sandwich-seul.png" alt="Sandwich" />
      <img class="prod" id="can" src="assets/img/canette.png" alt="Boisson 33 cl" />
      <img class="prod" id="donut" src="assets/img/donut.png" alt="Dessert" />
      <div class="cap" id="cap-can">+ Boisson 33cl</div>
      <div class="cap" id="cap-don">+ Dessert</div>

      <div id="ticket">
        <div id="paper"></div>
        <div id="t-head">GALZIN</div>
        <div class="dash" id="d1"></div>
        <div class="row" id="r1"><span>SANDWICH OU PANINI</span></div>
        <div class="row" id="r2"><span>+ BOISSON 33 CL</span></div>
        <div class="row" id="r3"><span>+ DESSERT</span></div>
        <div class="dash" id="d2"></div>
        <div id="tot-l">FORMULE</div>
        <div id="oval">
          <div class="price" id="p1">7,20€</div>
          <div class="price" id="p2">9,90€</div>
        </div>
      </div>

      <div id="logo"><img src="assets/img/galzin-logo.png" alt="Galzin" /></div>
      <div id="frame"></div>
      <div id="legal">Photos non contractuelles</div>
    </div>

    <script>
      gsap.set(["#p1", "#p2"], { autoAlpha: 0 });
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#frame", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.8 }, 0.2);

      // ── Logo intro → top-right corner
      tl.fromTo("#logo img", { autoAlpha: 0, scale: 0.6, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.1);
      tl.to("#logo", { x: 790, y: -340, scale: 170 / 360, duration: 0.7, ease: "power3.inOut" }, 1.2);

      // ── Brown band drops in, title
      tl.fromTo("#band", { y: -340 }, { y: 0, duration: 0.7, ease: "power3.out" }, 1.3);
      tl.fromTo("#t-a", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.7);
      tl.fromTo("#t-b", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 1.95);

      // ── Sandwich slides in, receipt prints its first line (2.6 → 5)
      tl.fromTo("#sand", { x: -900, rotation: -8 }, { x: 0, rotation: -3, duration: 0.8, ease: "power3.out" }, 2.6);
      tl.fromTo("#ticket", { y: -1150 }, { y: 0, duration: 0.8, ease: "power2.out" }, 3.1);
      tl.fromTo("#t-head", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 3.7);
      tl.fromTo("#r1", { autoAlpha: 0, clipPath: "inset(0% 100% 0% 0%)" }, { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power1.inOut" }, 4.0);

      // ── + Boisson: can drops in, ticket line, price 7,20 € (5.0 → 8.0)
      tl.fromTo("#can", { autoAlpha: 0, y: -600, rotation: 20 }, { autoAlpha: 1, y: 0, rotation: 8, duration: 0.5, ease: "bounce.out" }, 5.0);
      tl.fromTo("#cap-can", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" }, 5.4);
      tl.fromTo("#r2", { autoAlpha: 0, clipPath: "inset(0% 100% 0% 0%)" }, { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power1.inOut" }, 5.5);
      tl.fromTo("#tot-l", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 6.0);
      tl.fromTo("#oval", { autoAlpha: 0, scale: 0.3, rotation: -15 }, { autoAlpha: 1, scale: 1, rotation: -3, duration: 0.5, ease: "back.out(1.8)" }, 6.0);
      tl.fromTo("#p1", { autoAlpha: 0, y: 80 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 6.25);
      tl.to("#oval", { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, 6.9);

      // ── + Dessert: donut rolls in, ticket line, price → 9,90 € (8.2 → 11)
      tl.fromTo("#donut", { autoAlpha: 0, x: -700, rotation: -360 }, { autoAlpha: 1, x: 0, rotation: 0, duration: 0.8, ease: "power3.out" }, 8.2);
      tl.fromTo("#cap-don", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.out" }, 8.85);
      tl.fromTo("#r3", { autoAlpha: 0, clipPath: "inset(0% 100% 0% 0%)" }, { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power1.inOut" }, 9.0);
      tl.to("#p1", { y: -90, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 9.6);
      tl.fromTo("#p2", { autoAlpha: 0, y: 90 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 9.8);
      tl.to("#oval", { scale: 1.1, duration: 0.15, yoyo: true, repeat: 1 }, 10.3);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 0.75, duration: 0.5 }, 2.6);

      // ── Hold: ticket gets "stamped", products breathe (11 → 15)
      tl.to("#ticket", { rotation: 2, duration: 0.3, ease: "back.out(2)" }, 11.2);
      tl.to(["#sand", "#can", "#donut"], { y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 2, stagger: 0.15 }, 11.2);
      tl.to("#oval", { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, 13.0);
      tl.to("#logo", { scale: 210 / 360, x: 770, y: -320, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 1 }, 13.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      :root {
        /* Galzin palette, eyedropped from the logo */
        --brown: #2a1d12;
        --brown-light: #3d2b1b;
        --yellow: #ffcc4d;
        --cream: #f0ebe3;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--brown);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
      }

      /* Background */
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 33%, var(--brown-light) 0%, var(--brown) 62%);
      }
      #grains {
        position: absolute;
        inset: 0;
      }
      .grain {
        position: absolute;
        width: 14px;
        height: 30px;
        border-radius: 50%;
        background: var(--yellow);
      }

      /* Content */
      #content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 260px 110px 0;
        gap: 0;
      }
      #logo-wrap {
        position: relative;
        width: 620px;
        height: 620px;
      }
      #halo {
        position: absolute;
        inset: -60px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 204, 77, 0.35) 0%, rgba(255, 204, 77, 0) 65%);
      }
      #ring {
        position: absolute;
        inset: -34px;
        width: 688px;
        height: 688px;
      }
      #logo {
        position: absolute;
        inset: 0;
        width: 620px;
        height: 620px;
      }
      #headline {
        margin-top: 110px;
        color: var(--cream);
        font-size: 168px;
        line-height: 1;
        letter-spacing: 4px;
        text-align: center;
      }
      #underline {
        width: 420px;
        height: 10px;
        margin-top: 6px;
        border-radius: 5px;
        background: var(--yellow);
      }
      #ctas {
        margin-top: 80px;
        display: flex;
        flex-direction: row;
        gap: 70px;
      }
      .cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        width: 210px;
      }
      .btn {
        position: relative;
        width: 170px;
        height: 170px;
        border-radius: 50%;
        border: 7px solid var(--yellow);
        background: var(--brown);
      }
      .btn svg {
        position: absolute;
        inset: 0;
        width: 156px;
        height: 156px;
      }
      #btn-sub {
        background: var(--yellow);
      }
      #btn-sub-fill {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--cream);
      }
      .label {
        color: var(--yellow);
        font-size: 56px;
        line-height: 1;
        letter-spacing: 2px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
        <div id="bg"></div>
        <div id="grains"></div>

        <div id="content">
          <div id="logo-wrap">
            <div id="halo"></div>
            <svg id="ring" viewBox="0 0 688 688">
              <circle
                id="ring-circle"
                cx="344"
                cy="344"
                r="336"
                fill="none"
                stroke="#ffcc4d"
                stroke-width="6"
                stroke-linecap="round"
                transform="rotate(-90 344 344)"
              />
            </svg>
            <img id="logo" src="assets/galzin-logo.png" alt="Galzin" />
          </div>

          <div id="headline">ABONNE-TOI !</div>
          <div id="underline"></div>

          <div id="ctas">
            <div class="cta" id="cta-sub">
              <div class="btn" id="btn-sub">
                <div id="btn-sub-fill"></div>
                <svg viewBox="0 0 156 156">
                  <g id="icon-plus" stroke="#2a1d12" stroke-width="13" stroke-linecap="round">
                    <line x1="78" y1="46" x2="78" y2="110" />
                    <line x1="46" y1="78" x2="110" y2="78" />
                  </g>
                  <path
                    id="icon-check"
                    d="M48 80 L70 102 L110 58"
                    fill="none"
                    stroke="#2a1d12"
                    stroke-width="13"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <div class="label" id="label-sub">S'ABONNER</div>
            </div>

            <div class="cta" id="cta-bell">
              <div class="btn">
                <svg viewBox="0 0 156 156">
                  <g id="icon-bell" fill="#ffcc4d">
                    <path
                      d="M78 36c-17 0-29 13-29 30v20l-9 13v5h76v-5l-9-13V66c0-17-12-30-29-30z"
                    />
                    <circle cx="78" cy="113" r="9" />
                    <circle cx="78" cy="33" r="5" />
                  </g>
                  <g id="bell-waves" fill="none" stroke="#f0ebe3" stroke-width="6" stroke-linecap="round">
                    <path id="wave-l" d="M36 52c-6 8-8 18-6 28" />
                    <path id="wave-r" d="M120 52c6 8 8 18 6 28" />
                  </g>
                </svg>
              </div>
              <div class="label">LA CLOCHE</div>
            </div>

            <div class="cta" id="cta-com">
              <div class="btn">
                <svg viewBox="0 0 156 156">
                  <path
                    d="M38 46h80a8 8 0 0 1 8 8v42a8 8 0 0 1-8 8H72l-22 18v-18H38a8 8 0 0 1-8-8V54a8 8 0 0 1 8-8z"
                    fill="#ffcc4d"
                  />
                  <circle class="dot" id="dot1" cx="58" cy="75" r="7" fill="#2a1d12" />
                  <circle class="dot" id="dot2" cx="78" cy="75" r="7" fill="#2a1d12" />
                  <circle class="dot" id="dot3" cx="98" cy="75" r="7" fill="#2a1d12" />
                </svg>
              </div>
              <div class="label">COMMENTE</div>
            </div>
          </div>

        </div>
    </div>

    <script>
      // Deterministic drifting wheat grains (seeded, no Math.random)
      let seed = 1938;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const grainsEl = document.getElementById("grains");
      const grains = [];
      for (let i = 0; i < 22; i++) {
        const g = document.createElement("div");
        g.className = "grain";
        g.style.left = Math.round(40 + rand() * 1000) + "px";
        g.style.top = Math.round(80 + rand() * 1760) + "px";
        const s = 0.5 + rand() * 0.8;
        grainsEl.appendChild(g);
        grains.push({ el: g, s, rot: rand() * 180, drift: 60 + rand() * 120, op: 0.08 + rand() * 0.14 });
      }

      const tl = gsap.timeline({ paused: true });
      const RING_LEN = 2 * Math.PI * 336;

      // Background grains: fade in and drift upward the whole time
      grains.forEach((g, i) => {
        tl.fromTo(
          g.el,
          { autoAlpha: 0, scale: g.s, rotation: g.rot, y: 0 },
          { autoAlpha: g.op, y: -g.drift, rotation: g.rot + 40, duration: 4, ease: "none" },
          0
        );
      });

      // 1. Logo entrance (0 → 0.9s)
      tl.fromTo("#logo", { scale: 0.55, rotation: -14, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.8, ease: "back.out(1.6)" }, 0.05);
      tl.fromTo("#ring-circle", { attr: { "stroke-dasharray": RING_LEN, "stroke-dashoffset": RING_LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power3.inOut" }, 0.15);
      tl.fromTo("#halo", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 0.35);
      // gentle breathing on the logo afterwards
      tl.fromTo("#logo-wrap", { scale: 1 }, { scale: 1.03, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);

      // 2. Headline + underline sweep (0.55 → 1.1s)
      tl.fromTo("#headline", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.55);
      tl.fromTo("#underline", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.8);

      // 3. CTA buttons pop in (0.95 → 1.5s)
      ["#cta-sub", "#cta-bell", "#cta-com"].forEach((sel, i) => {
        tl.fromTo(sel, { autoAlpha: 0, y: 50, scale: 0.7 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.95 + i * 0.12);
      });

      // 4a. Subscribe: press → check, button turns cream (1.6 → 2.0s)
      tl.fromTo("#btn-sub-fill", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 1.68);
      tl.fromTo("#btn-sub", { scale: 1 }, { scale: 0.86, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1 }, 1.6);
      tl.fromTo("#icon-plus", { autoAlpha: 1, rotation: 0, transformOrigin: "50% 50%" }, { autoAlpha: 0, rotation: 90, duration: 0.18, ease: "power2.in" }, 1.65);
      tl.fromTo("#icon-check", { attr: { "stroke-dasharray": 100, "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, 1.78);
      tl.fromTo("#label-sub", { color: "#ffcc4d" }, { color: "#f0ebe3", duration: 0.2 }, 1.75);

      // 4b. Bell rings (2.1 → 2.8s)
      tl.fromTo("#icon-bell", { rotation: 0, transformOrigin: "50% 22%" }, { keyframes: [
        { rotation: 22, duration: 0.09 }, { rotation: -20, duration: 0.12 }, { rotation: 15, duration: 0.11 },
        { rotation: -10, duration: 0.1 }, { rotation: 5, duration: 0.09 }, { rotation: 0, duration: 0.09 }
      ], ease: "sine.inOut" }, 2.1);
      tl.fromTo("#bell-waves", { autoAlpha: 0, scale: 0.8, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1.1, duration: 0.2, ease: "power2.out" }, 2.12);
      tl.to("#bell-waves", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 2.55);

      // 4c. Comment typing dots (2.6 → 3.6s)
      ["#dot1", "#dot2", "#dot3"].forEach((sel, i) => {
        tl.fromTo(sel, { y: 0 }, { y: -12, duration: 0.16, ease: "sine.out", yoyo: true, repeat: 3 }, 2.6 + i * 0.1);
      });


      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

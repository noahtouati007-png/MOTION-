<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Big Shoulders";
        src: url("assets/fonts/big-shoulders-display-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
      }
      @font-face {
        font-family: "Big Shoulders";
        src: url("assets/fonts/big-shoulders-display-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "DM Mono";
        src: url("assets/fonts/dm-mono-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      /* THEME — "Le Championnat des Rois": a sports team sheet on Galzin chocolate.
         Yellow + red come straight from the fèves (Minion yellow, red shorts). Straight lines only.
         TikTok safe zone: reading text stays inside x 70–940, y 160–1480. */
      :root {
        --bg: #23170e;
        --bg-2: #2f2014;
        --cream: #f6ecd9;
        --yellow: #ffcc3a;
        --red: #e2452b;
        --line: rgba(246, 236, 217, 0.09);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Big Shoulders", sans-serif;
        font-weight: 900;
        color: var(--cream);
        text-transform: uppercase;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 70%);
      }
      #pitch {
        position: absolute;
        inset: 0;
      }
      .mono {
        font-family: "DM Mono", monospace;
        font-weight: 500;
        letter-spacing: 3px;
      }

      /* Slanted jersey stripes */
      .stripe {
        position: absolute;
        left: -200px;
        width: 1480px;
        transform: rotate(-9deg);
      }
      #st-y {
        top: 1210px;
        height: 120px;
        background: var(--yellow);
      }
      #st-r {
        top: 1350px;
        height: 34px;
        background: var(--red);
      }

      /* Header bar */
      #head {
        position: absolute;
        left: 70px;
        top: 170px;
        width: 870px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 30px;
        color: var(--cream);
      }
      #head b {
        font-weight: 500;
        color: var(--yellow);
      }
      #logo {
        position: absolute;
        left: 800px;
        top: 1195px;
        width: 140px;
        height: 140px;
      }

      /* Opening title */
      #title {
        position: absolute;
        left: 70px;
        top: 250px;
        width: 900px;
        line-height: 0.84;
      }
      #title div {
        display: block;
      }
      .t-s {
        font-size: 150px;
      }
      .t-l {
        font-size: 236px;
        letter-spacing: -4px;
      }
      .t-m {
        font-size: 168px;
        letter-spacing: -2px;
      }
      .t-y {
        color: var(--yellow);
      }
      #ref {
        position: absolute;
        left: 560px;
        top: 700px;
        width: 420px;
        height: 760px;
        object-fit: contain;
        filter: drop-shadow(20px 30px 0 rgba(0, 0, 0, 0.35));
      }
      #kick {
        position: absolute;
        left: 70px;
        top: 960px;
        width: 470px;
        font-size: 64px;
        line-height: 0.95;
        color: var(--cream);
      }
      #kick span {
        color: var(--yellow);
      }

      /* Player cards (one at a time) */
      .card {
        position: absolute;
        inset: 0;
      }
      .card-num {
        position: absolute;
        left: 0;
        top: 330px;
        width: 1080px;
        text-align: center;
        font-size: 860px;
        line-height: 0.8;
        letter-spacing: -30px;
        color: rgba(255, 204, 58, 0.06);
        -webkit-text-stroke: 5px rgba(255, 204, 58, 0.5);
      }
      .card-img {
        position: absolute;
        left: 240px;
        top: 360px;
        width: 600px;
        height: 820px;
        object-fit: contain;
        filter: drop-shadow(22px 30px 0 rgba(0, 0, 0, 0.35));
      }
      .card-bar {
        position: absolute;
        left: 70px;
        top: 1240px;
        width: 870px;
      }
      .card-tag {
        display: inline-block;
        padding: 8px 18px;
        background: var(--red);
        color: var(--cream);
        font-size: 30px;
      }
      .card-name {
        margin-top: 8px;
        font-size: 170px;
        line-height: 0.86;
        color: var(--cream);
      }

      /* Team photo */
      #team-h {
        position: absolute;
        left: 70px;
        top: 250px;
        width: 870px;
        font-size: 150px;
        line-height: 0.86;
      }
      #team-h span {
        color: var(--yellow);
      }
      .tm {
        position: absolute;
        width: 170px;
        height: 290px;
        margin-left: -85px;
      }
      .tm img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: 50% 100%;
        filter: drop-shadow(12px 16px 0 rgba(0, 0, 0, 0.35));
      }
      .tm i {
        position: absolute;
        left: 0;
        top: 300px;
        width: 170px;
        text-align: center;
        font-style: normal;
        font-size: 44px;
        color: var(--yellow);
      }

      /* Galette slot: viewfinder frame until the real photo arrives */
      #galette {
        position: absolute;
        left: 110px;
        top: 1080px;
        width: 860px;
        height: 400px;
      }
      #galette .slot {
        position: absolute;
        inset: 0;
        background: rgba(246, 236, 217, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        color: rgba(246, 236, 217, 0.7);
      }
      #galette .c {
        position: absolute;
        width: 70px;
        height: 70px;
        border-color: var(--yellow);
        border-style: solid;
        border-width: 0;
      }
      #galette .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #q {
        position: absolute;
        left: 70px;
        top: 300px;
        width: 900px;
        font-size: 170px;
        line-height: 0.84;
      }
      #q span {
        color: var(--yellow);
      }

      /* Score table */
      #score {
        position: absolute;
        left: 70px;
        top: 540px;
        width: 870px;
      }
      #score-h {
        font-size: 30px;
        color: var(--yellow);
        margin-bottom: 18px;
      }
      .row {
        position: relative;
        height: 150px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        background: var(--cream);
        color: var(--bg);
        clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
      }
      .row .p {
        font-size: 96px;
        line-height: 1;
      }
      .row .p small {
        font-family: "DM Mono", monospace;
        font-weight: 500;
        font-size: 30px;
        letter-spacing: 3px;
      }
      .row .e {
        font-size: 130px;
        line-height: 1;
        color: var(--red);
      }
      #date {
        position: absolute;
        left: 70px;
        top: 1200px;
        width: 700px;
        font-size: 92px;
        line-height: 0.9;
        color: var(--cream);
      }
      #date span {
        color: var(--yellow);
      }
      #legal {
        position: absolute;
        left: 70px;
        top: 1440px;
        font-size: 26px;
        color: rgba(246, 236, 217, 0.7);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>
      <svg id="pitch" viewBox="0 0 1080 1920" fill="none" stroke="rgba(246,236,217,0.09)" stroke-width="4">
        <rect x="40" y="40" width="1000" height="1840" />
        <line x1="40" y1="960" x2="1040" y2="960" />
        <rect x="240" y="40" width="600" height="300" />
        <rect x="390" y="40" width="300" height="110" />
        <rect x="240" y="1580" width="600" height="300" />
        <rect x="390" y="1770" width="300" height="110" />
      </svg>
      <div class="stripe" id="st-y"></div>
      <div class="stripe" id="st-r"></div>

      <div id="head" class="mono"><span>GALZIN <b>×</b> LES MINIONS</span><span id="head-r">SAISON 2027</span></div>

      <!-- Opening -->
      <div id="title">
        <div class="t-s">LE</div>
        <div class="t-m">CHAMPIONNAT</div>
        <div class="t-l">DES</div>
        <div class="t-l t-y">ROIS</div>
      </div>
      <img id="ref" src="assets/img/feve-01.png" alt="" />
      <div id="kick">10 FÈVES <span>LES MINIONS</span> ENTRENT SUR LE TERRAIN</div>

      <!-- Line-up -->
      <div id="cards"></div>

      <!-- Team photo + galette -->
      <div id="team-h">L'ÉQUIPE <span>AU COMPLET</span></div>
      <div id="team"></div>
      <div id="galette">
        <div class="slot mono" id="gal-slot">[ PHOTO GALETTE ]</div>
        <div class="c" style="left: 0; top: 0; border-left-width: 8px; border-top-width: 8px"></div>
        <div class="c" style="right: 0; top: 0; border-right-width: 8px; border-top-width: 8px"></div>
        <div class="c" style="left: 0; bottom: 0; border-left-width: 8px; border-bottom-width: 8px"></div>
        <div class="c" style="right: 0; bottom: 0; border-right-width: 8px; border-bottom-width: 8px"></div>
      </div>

      <div id="q">QUEL <span>CHAMPION</span> SE CACHE DANS TA GALETTE ?</div>

      <!-- Prices -->
      <div id="score">
        <div id="score-h" class="mono">// TABLEAU DES PRIX</div>
        <div id="rows"></div>
      </div>
      <div id="date">DÈS LE 2 JANVIER <span>CHEZ GALZIN</span></div>
      <div id="legal" class="mono">PHOTOS NON CONTRACTUELLES</div>

      <img id="logo" src="assets/img/galzin-logo.png" alt="Galzin" />
    </div>

    <script>
      // ── CONTENT — edit here
      const FEVES = [
        { name: "L'ARBITRE", img: "feve-01.png" },
        { name: "LE RUGBYMAN", img: "feve-02.png" },
        { name: "LE VOLLEYEUR", img: "feve-03.png" },
        { name: "LE BOXEUR", img: "feve-04.png" },
        { name: "LE BASKETTEUR", img: "feve-05.png" },
        { name: "LE FOOTBALLEUR", img: "feve-06.png" },
        { name: "LE SPRINTEUR", img: "feve-07.png" },
        { name: "LE TENNISMAN", img: "feve-08.png" },
        { name: "LE SUPPORTER", img: "feve-09.png" },
        { name: "LE CHAMPION", img: "feve-10.png" },
      ];
      const GALETTE_IMG = ""; // e.g. "galette.png" — replaces the [ PHOTO GALETTE ] frame
      const PRICES = [
        ["4", "12,90 €"],
        ["6", "17,90 €"],
        ["8", "22,90 €"],
      ];

      const pad = (n) => (n < 10 ? "0" : "") + n;
      const cardsEl = document.getElementById("cards");
      const teamEl = document.getElementById("team");
      // team photo: two rows of five
      const TPOS = (i) => ({ x: 540 + ((i % 5) - 2) * 180, y: i < 5 ? 520 : 900 });
      FEVES.forEach((f, i) => {
        cardsEl.insertAdjacentHTML(
          "beforeend",
          '<div class="card" id="cd' + i + '"><div class="card-num" id="cn' + i + '">' + pad(i + 1) + '</div><img class="card-img" id="ci' + i + '" src="assets/img/' + f.img + '" alt="" />' +
            '<div class="card-bar"><div class="card-tag mono">N°' + pad(i + 1) + " / " + FEVES.length + '</div><div class="card-name" id="cm' + i + '">' + f.name + "</div></div></div>"
        );
        const p = TPOS(i);
        teamEl.insertAdjacentHTML("beforeend", '<div class="tm" id="tm' + i + '" style="left:' + p.x + "px;top:" + p.y + 'px"><img src="assets/img/' + f.img + '" alt="" /><i>' + pad(i + 1) + "</i></div>");
      });
      if (GALETTE_IMG) document.getElementById("gal-slot").innerHTML = '<img class="shot" src="assets/img/' + GALETTE_IMG + '" alt="" />';
      document.getElementById("rows").innerHTML = PRICES.map(
        (p, i) => '<div class="row" id="rw' + i + '"><div class="p">' + p[0] + ' <small>PARTS</small></div><div class="e">' + p[1] + "</div></div>"
      ).join("");

      gsap.set(["#logo", ".card", "#team-h", ".tm", "#galette", "#q", "#score", "#date", "#legal"], { autoAlpha: 0 });

      const tl = gsap.timeline({ paused: true });

      // ── 0 → 3.2 Opening (title + referee already on screen at frame 0 for the thumbnail)
      tl.fromTo("#ref", { rotation: -4, y: 0 }, { rotation: 3, y: -16, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0);
      tl.fromTo("#st-y", { x: -900 }, { x: 0, duration: 0.5, ease: "power4.out" }, 0.15);
      tl.fromTo("#st-r", { x: 900 }, { x: 0, duration: 0.5, ease: "power4.out" }, 0.25);
      tl.fromTo("#kick", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.6);
      tl.to(["#title", "#kick"], { x: -1100, duration: 0.45, ease: "power3.in" }, 3.0);
      tl.to("#ref", { x: 700, duration: 0.45, ease: "power3.in" }, 3.0);
      tl.to(["#st-y", "#st-r"], { y: 430, duration: 0.45, ease: "power3.inOut" }, 3.0);

      // ── 3.4 → 12.4 Line-up, one player per beat
      const CS = 0.9;
      FEVES.forEach((f, i) => {
        const t = 3.4 + i * CS;
        tl.set("#head-r", { textContent: "COMPOSITION · " + pad(i + 1) }, t);
        tl.set("#cd" + i, { autoAlpha: 1 }, t);
        tl.fromTo("#cn" + i, { autoAlpha: 0, y: 120 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
        tl.fromTo("#ci" + i, { x: 520, rotation: 8 }, { x: 0, rotation: 0, duration: 0.3, ease: "back.out(1.4)" }, t);
        tl.fromTo("#cm" + i, { x: -300, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.25, ease: "power3.out" }, t + 0.06);
        tl.to("#ci" + i, { x: -560, rotation: -8, duration: 0.2, ease: "power2.in" }, t + CS - 0.2);
        tl.to(["#cn" + i, "#cm" + i], { autoAlpha: 0, duration: 0.15 }, t + CS - 0.15);
        tl.set("#cd" + i, { autoAlpha: 0 }, t + CS);
      });

      // ── 12.4 → 15 Team photo
      tl.set("#head-r", { textContent: "L'ÉQUIPE" }, 12.4);
      tl.fromTo("#team-h", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 12.4);
      FEVES.forEach((f, i) => {
        tl.fromTo("#tm" + i, { autoAlpha: 0, y: 80 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 12.5 + i * 0.07);
      });

      // ── 14.4 → 16.4 Everyone dives into the galette
      tl.to("#team-h", { autoAlpha: 0, duration: 0.25 }, 14.3);
      tl.to(["#st-y", "#st-r"], { autoAlpha: 0, duration: 0.3 }, 14.3);
      tl.fromTo("#galette", { autoAlpha: 0, y: 120 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 14.4);
      FEVES.forEach((f, i) => {
        const p = TPOS(i);
        tl.to("#tm" + i, { keyframes: [{ y: -50, duration: 0.15, ease: "power2.out" }, { x: 540 - p.x, y: 1230 - p.y, scale: 0.35, duration: 0.35, ease: "power2.in" }] }, 14.9 + i * 0.1);
        tl.set("#tm" + i, { autoAlpha: 0 }, 15.4 + i * 0.1);
      });
      tl.to("#galette", { keyframes: [{ y: 14, duration: 0.06 }, { y: 0, duration: 0.12 }] }, 16.3);

      // ── 16.4 → 18.6 The question
      tl.set("#head-r", { textContent: "TIRAGE AU SORT" }, 16.4);
      tl.fromTo("#q", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 16.4);
      tl.to("#galette", { y: -120, duration: 0.5, ease: "power2.inOut" }, 16.4);

      // ── 18.6 → 21 Score table + date (the Galzin outro follows in the final edit)
      tl.to(["#q", "#galette"], { autoAlpha: 0, duration: 0.25 }, 18.6);
      tl.set("#head-r", { textContent: "BILLETTERIE" }, 18.7);
      tl.set("#score", { autoAlpha: 1 }, 18.7);
      tl.fromTo("#score-h", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, 18.7);
      PRICES.forEach((p, i) => {
        tl.fromTo("#rw" + i, { x: 900 }, { x: 0, duration: 0.35, ease: "power4.out" }, 18.75 + i * 0.1);
      });
      tl.fromTo("#date", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 19.0);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 19.1);
      tl.fromTo("#logo", { autoAlpha: 0, rotation: -20 }, { autoAlpha: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 19.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

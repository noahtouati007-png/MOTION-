<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-600-italic.woff2") format("woff2");
        font-weight: 600;
        font-style: italic;
      }
      @font-face {
        font-family: "Crimson Pro";
        src: url("assets/fonts/crimson-pro-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Dancing Script";
        src: url("assets/fonts/dancing-script-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      /* THEME — Galzin house look (chocolate, cream, gold) ; the Minions only show up in the yellow line.
         TikTok safe zone: reading text stays inside x 70–940, y 160–1480. */
      :root {
        --bg-center: #5a3822;
        --bg-edge: #1d1109;
        --cream: #fdf1dc;
        --yellow: #ffcc4d;
        --ink: #3a2414;
        --gold-a: #f3e2bd;
        --gold-b: #b48a52;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg-edge);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Bebas Neue", sans-serif;
        color: var(--cream);
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, var(--bg-center) 0%, var(--bg-edge) 80%);
      }
      #dots {
        position: absolute;
        inset: 0;
      }
      .dot {
        position: absolute;
        border-radius: 50%;
        border: 3px solid var(--yellow);
      }
      #frame {
        position: absolute;
        inset: 28px;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        opacity: 0.55;
      }
      #logo {
        position: absolute;
        left: 465px;
        top: 70px;
        width: 150px;
        height: 150px;
      }

      #title {
        position: absolute;
        left: 70px;
        width: 870px;
        top: 230px;
        text-align: center;
      }
      #script {
        display: inline-block;
        font-family: "Dancing Script", cursive;
        font-weight: 700;
        font-size: 140px;
        line-height: 1.15;
        color: var(--cream);
      }
      #sub {
        margin-top: -14px;
        font-size: 58px;
        letter-spacing: 6px;
        color: var(--yellow);
      }

      /* Hook */
      #hook {
        position: absolute;
        left: 70px;
        width: 940px;
        top: 720px;
        text-align: center;
      }
      #hook-1 {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 72px;
        line-height: 1.1;
        color: var(--yellow);
      }
      #hook-2 {
        margin-top: 10px;
        font-size: 150px;
        line-height: 0.98;
        letter-spacing: 3px;
        color: var(--cream);
      }
      .hw {
        display: inline-block;
      }

      /* Photo slots (empty until the real photos arrive) */
      .ph {
        position: absolute;
        border: 3px dashed rgba(243, 226, 189, 0.5);
        background: radial-gradient(ellipse, rgba(255, 204, 77, 0.1) 0%, rgba(255, 204, 77, 0) 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        color: var(--gold-a);
        opacity: 0.85;
      }
      .shot {
        position: absolute;
        object-fit: contain;
        filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.5));
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 204, 77, 0.32) 0%, rgba(255, 204, 77, 0) 65%);
      }

      /* One big fève at a time */
      .card {
        position: absolute;
        left: 140px;
        top: 560px;
        width: 800px;
        height: 900px;
      }
      .card .glow {
        left: 100px;
        top: 80px;
        width: 600px;
        height: 620px;
      }
      .card .ph {
        left: 195px;
        top: 130px;
        width: 410px;
        height: 520px;
        border-radius: 50%;
        font-size: 50px;
        line-height: 1.05;
      }
      .card .shot {
        left: 150px;
        top: 120px;
        width: 500px;
        height: 540px;
      }
      .num {
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: var(--cream);
        color: var(--ink);
        font-size: 58px;
        line-height: 78px;
        text-align: center;
      }
      .card .num {
        left: 355px;
        top: 20px;
        width: 90px;
        height: 90px;
        font-size: 74px;
        line-height: 100px;
      }
      .card-name {
        position: absolute;
        left: 0;
        top: 690px;
        width: 800px;
        text-align: center;
        font-size: 120px;
        line-height: 1;
        letter-spacing: 3px;
        color: var(--cream);
      }
      .card-of {
        position: absolute;
        left: 0;
        top: 810px;
        width: 800px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 50px;
        color: var(--yellow);
      }

      /* Five small fèves for the dive */
      .mini {
        position: absolute;
        top: 560px;
        width: 160px;
        height: 200px;
        margin-left: -80px;
      }
      .mini .ph {
        inset: 0;
        border-radius: 50%;
        font-size: 30px;
      }
      .mini .shot {
        inset: 0;
        width: 160px;
        height: 200px;
      }

      /* Galette */
      #galette {
        position: absolute;
        left: 140px;
        top: 900px;
        width: 800px;
        height: 520px;
      }
      #gal-glow {
        position: absolute;
        inset: -70px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 204, 77, 0.35) 0%, rgba(255, 204, 77, 0) 65%);
      }
      #galette .ph {
        inset: 0;
        border-radius: 50%;
        font-size: 56px;
      }
      #galette .shot {
        inset: 0;
        width: 800px;
        height: 520px;
      }

      #q {
        position: absolute;
        left: 70px;
        width: 940px;
        top: 560px;
        text-align: center;
      }
      #q-1 {
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 56px;
        line-height: 1.1;
        color: var(--yellow);
      }
      #q-2 {
        margin-top: 6px;
        font-size: 128px;
        line-height: 0.98;
        letter-spacing: 3px;
        color: var(--cream);
      }

      /* Prices */
      .medal {
        position: absolute;
        top: 1010px;
        width: 270px;
        height: 270px;
        margin-left: -135px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--gold-a) 0%, var(--gold-b) 100%);
        box-shadow: 0 24px 46px rgba(0, 0, 0, 0.5);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .price {
        display: flex;
        align-items: flex-start;
        line-height: 0.82;
      }
      .price .big {
        font-size: 134px;
      }
      .price .sm {
        font-size: 72px;
        margin-top: 10px;
      }
      .parts {
        margin-top: 2px;
        font-size: 42px;
        line-height: 1;
        letter-spacing: 2px;
      }
      #date {
        position: absolute;
        left: 70px;
        width: 940px;
        top: 1330px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 56px;
        line-height: 1.1;
        color: var(--yellow);
      }
      #legal {
        position: absolute;
        left: 70px;
        width: 940px;
        top: 1478px;
        text-align: center;
        font-family: "Crimson Pro", serif;
        font-weight: 700;
        font-size: 28px;
        color: var(--cream);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>
      <div id="dots"></div>

      <img id="logo" src="assets/img/galzin-logo.png" alt="Galzin" />
      <div id="title"><div id="script">Galette des Rois</div><div id="sub">ÉDITION LES MINIONS</div></div>

      <div id="hook">
        <div id="hook-1">Cette année,</div>
        <div id="hook-2"><span class="hw">DES MINIONS</span> <span class="hw">SE CACHENT</span> <span class="hw">DANS NOS</span> <span class="hw">GALETTES</span></div>
      </div>

      <div id="cards"></div>
      <div id="minis"></div>

      <div id="galette">
        <div id="gal-glow"></div>
        <div id="gal-art"></div>
      </div>

      <div id="q">
        <div id="q-1">Une fève Les Minions dans chaque galette</div>
        <div id="q-2">LAQUELLE VAS-TU TROUVER ?</div>
      </div>

      <div id="prices"></div>
      <div id="date">Dès le 2 janvier<br />dans tes boutiques Galzin</div>
      <div id="legal">Photos non contractuelles</div>

      <div id="frame"></div>
    </div>

    <script>
      // ── CONTENT — edit here. Drop the real photos in assets/img/ (PNG without background) and set `img`.
      const FEVES = [
        { name: "FÈVE 1", img: "" },
        { name: "FÈVE 2", img: "" },
        { name: "FÈVE 3", img: "" },
        { name: "FÈVE 4", img: "" },
        { name: "FÈVE 5", img: "" },
      ];
      const GALETTE_IMG = ""; // e.g. "galette.png"
      const PRICES = [
        { parts: "4 PARTS", big: "12", sm: "€90" },
        { parts: "6 PARTS", big: "17", sm: "€90" },
        { parts: "8 PARTS", big: "22", sm: "€90" },
      ];

      const art = (f, i, label) => (f.img ? '<img class="shot" src="assets/img/' + f.img + '" alt="" />' : '<div class="ph">' + label + "</div>");
      const cardsEl = document.getElementById("cards");
      const minisEl = document.getElementById("minis");
      const MX = (i) => 540 + (i - 2) * 180;
      FEVES.forEach((f, i) => {
        cardsEl.insertAdjacentHTML(
          "beforeend",
          '<div class="card" id="cd' + i + '"><div class="glow"></div>' + art(f, i, "photo<br />fève " + (i + 1)) +
            '<div class="num">' + (i + 1) + '</div><div class="card-name">' + f.name + '</div><div class="card-of">' + (i + 1) + " / " + FEVES.length + "</div></div>"
        );
        minisEl.insertAdjacentHTML("beforeend", '<div class="mini" id="mn' + i + '" style="left:' + MX(i) + 'px">' + art(f, i, "fève " + (i + 1)) + "</div>");
      });
      document.getElementById("gal-art").innerHTML = GALETTE_IMG ? '<img class="shot" src="assets/img/' + GALETTE_IMG + '" alt="" />' : '<div class="ph">photo galette</div>';
      document.getElementById("prices").innerHTML = PRICES.map(
        (p, i) =>
          '<div class="medal" id="md' + i + '" style="left:' + (540 + (i - 1) * 300) + 'px"><div class="price"><span class="big">' + p.big + '</span><span class="sm">' + p.sm + '</span></div><div class="parts">' + p.parts + "</div></div>"
      ).join("");

      let seed = 83;
      const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const dotsEl = document.getElementById("dots");
      const dots = [];
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("div");
        d.className = "dot";
        const size = Math.round(26 + rand() * 40);
        d.style.width = d.style.height = size + "px";
        d.style.left = Math.round(60 + rand() * 940) + "px";
        d.style.top = Math.round(60 + rand() * 1780) + "px";
        dotsEl.appendChild(d);
        dots.push({ el: d, op: 0.08 + rand() * 0.12, dx: -30 + rand() * 60, dy: -50 - rand() * 60 });
      }

      gsap.set([".card", ".mini", "#galette", "#q", ".medal", "#date", "#legal"], { autoAlpha: 0 });

      const tl = gsap.timeline({ paused: true });
      dots.forEach((d) => {
        tl.fromTo(d.el, { autoAlpha: d.op * 0.5, x: 0, y: 0 }, { autoAlpha: d.op, x: d.dx, y: d.dy, duration: 18, ease: "none" }, 0);
      });

      // ── 0 → 3.4 Hook (title + logo already on screen at frame 0 for the thumbnail)
      tl.fromTo("#script", { scale: 0.96 }, { scale: 1, duration: 1.2, ease: "power2.out" }, 0);
      tl.fromTo("#hook-1", { scale: 0.9 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 0);
      gsap.utils.toArray(".hw").forEach((w, i) => {
        tl.fromTo(w, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.3 + i * 0.28);
      });
      tl.to("#hook", { autoAlpha: 0, y: -30, duration: 0.35, ease: "power2.in" }, 3.3);

      // ── 3.7 → 10.2 The five fèves, one by one
      const CS = 1.3;
      FEVES.forEach((f, i) => {
        const t = 3.7 + i * CS;
        tl.fromTo("#cd" + i, { autoAlpha: 0, x: 120 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, t);
        tl.fromTo("#cd" + i + " .num", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)" }, t + 0.15);
        tl.to("#cd" + i, { autoAlpha: 0, x: -120, duration: 0.3, ease: "power2.in" }, t + CS - 0.3);
      });

      // ── 10.2 → 13 Lined up, the galette arrives, they slip inside
      FEVES.forEach((f, i) => {
        tl.fromTo("#mn" + i, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 10.25 + i * 0.08);
      });
      tl.fromTo("#galette", { autoAlpha: 0, y: 140 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.5);
      FEVES.forEach((f, i) => {
        const t = 11.2 + i * 0.3;
        tl.to("#mn" + i, { x: 540 - MX(i), y: 540, scale: 0.4, autoAlpha: 0, duration: 0.55, ease: "power2.in" }, t);
      });
      tl.fromTo("#gal-glow", { scale: 1 }, { scale: 1.12, duration: 0.25, yoyo: true, repeat: 1, ease: "power1.inOut" }, 12.75);

      // ── 13.1 → 15.4 The question
      tl.to("#title", { autoAlpha: 0, duration: 0.3 }, 13.0);
      tl.fromTo("#q", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 13.1);

      // ── 15.5 → 18 Prices + date (the Galzin outro follows in the final edit)
      tl.to("#q", { autoAlpha: 0, duration: 0.3 }, 15.4);
      tl.fromTo("#title", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, immediateRender: false }, 15.5);
      tl.to("#galette", { y: -330, scale: 0.72, duration: 0.6, ease: "power3.inOut" }, 15.4);
      PRICES.forEach((p, i) => {
        tl.fromTo("#md" + i, { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 15.7 + i * 0.12);
      });
      tl.fromTo("#date", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 16.0);
      tl.fromTo("#legal", { autoAlpha: 0 }, { autoAlpha: 0.75, duration: 0.4 }, 16.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
